name: Windows Release

# 태그(vX.Y.Z) push → Windows .msi 를 빌드해 그 GitHub 릴리스에 첨부한다.
# 수동 실행(workflow_dispatch) → 빌드만 하고 artifact 로 올린다(태그·릴리스 불변, CI 검증용).
#
# mac 은 크로스컴파일이 불가(wgpu/wry/cargo-wix Windows 전용)라 Windows .msi 는
# 이 러너에서만 나온다. mac .dmg 는 로컬 scripts/release.sh 가 계속 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # kasa-mcp 는 루트 Cargo.toml 에서 opt-level=0 으로 pin 돼 있다 —
      # Windows rustc/LLVM 이 이 크레이트 최적화 시 STATUS_ACCESS_VIOLATION 으로 죽어서.
      - name: Build kasaterm (release)
        run: cargo build --release -p kasaterm

      # windows-latest 러너엔 WiX 3.14.1(Legacy, candle/light)이 이미 깔려 있고
      # WIX 환경변수까지 잡혀 있다(2026-04 기준). main.wxs 도 v3 Legacy 스키마라
      # WiX 별도 설치는 불필요. cargo-wix 서브커맨드만 있으면 된다.
      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      # main.wxs 의 Source 경로가 워크스페이스 루트 기준(app\kasaterm\wix\...)이라
      # 반드시 루트에서 실행한다. --no-build 로 위에서 만든 target\release\kasaterm.exe 재사용.
      - name: Build MSI
        run: cargo wix -p kasaterm --no-build --nocapture

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path target\wix -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no .msi produced in target\wix" }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "built $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

      # 태그 push → 해당 릴리스에 MSI 첨부(릴리스 없으면 생성).
      - name: Attach MSI to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.msi.outputs.path }}
          fail_on_unmatched_files: true

      # 수동 실행 → artifact 로만(릴리스 불변, 빌드 검증용).
      - name: Upload MSI artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msi.outputs.name }}
          path: ${{ steps.msi.outputs.path }}
