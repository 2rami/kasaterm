name: Release

# 태그(vX.Y.Z) push 하나로 릴리스 전체 자동화:
#   msi(Windows 러너) + dmg(macOS 러너) 빌드 → GitHub 릴리스 첨부 →
#   둘 다 끝나면 appcast 2종(EdDSA 서명)을 docs/ 에 커밋 → Pages 로 서빙.
# 로컬은 scripts/tag-release.sh 로 버전 bump + 태그 push 만 하면 된다.
# (scripts/release.sh 는 로컬 수동 폴백으로 유지.)
#
# 수동 실행(workflow_dispatch)
#   tag 없이 → msi/dmg 빌드만 하고 artifact 로 올린다(태그·릴리스·appcast 불변, CI 검증용).
#   tag=vX.Y.Z → 이미 선 태그의 릴리스를 마무리한다(태그를 새로 만들거나 옮기지 않는다). 태그 push 로 돈 실행이 중간에
#     멈췄을 때 — 태그의 워크플로는 그 커밋에 박혀 고칠 수 없으니, 고친 main 의 워크플로로 같은 일을 그 태그에 대고 한다.
#     platforms=macos 는 Windows 를 건드리지 않는 **부분 게시**(mac 피드만 갱신, Windows 피드는 그대로 — 성공으로 치지 않는다).
#
# git LFS 는 실물 그림이 필요한 굽기에만 받는다 — Windows 굽기(학생 그림을 실행 파일에 넣고 arona-ui·폰트를 담는다)와
# CI 가 mac 을 굽는 길. 로컬 dmg 를 검증만 하는 mac job 과 appcast 는 그림이 필요 없어 LFS 를 안 받는다(대역폭 예산,
# 2026-09-27 v0.2.1 실행이 두 job 모두 체크아웃의 LFS 예산 초과로 멈췄다). Windows 굽기는 GitHub LFS 대신 미니의 읽기 전용
# 창구에서 받는다(scripts/mini-lfs.sh) — 미니가 꺼져 있으면 그 job 이 분명히 실패한다.
#
# Secrets:
#   SPARKLE_ED_PRIVATE_KEY — Sparkle EdDSA 개인키(appcast 서명, mac/win 공용)
#   MAC_SIGN_P12 / MAC_SIGN_P12_PASSWORD — kasaterm-ci self-signed codesign 인증서(MAC_ARTIFACT=ci 일 때만)
#   MINI_LFS_TOKEN — 미니 LFS 창구 토큰(build-msi 만). 창구 주소는 저장소 변수 MINI_LFS_URL
#
# mac dmg 를 어디서 만드나(MAC_ARTIFACT):
#   local — 조종 기기(미니)가 Developer ID·hardened runtime 으로 서명하고 애플 공증·staple 까지 한 dmg 를 태그 뒤 릴리스에
#           올린다(tools/release fastpatch). 이 job 은 굽지 않고 그 dmg 를 기다렸다가 팀·공증·판 번호를 검증만 한다.
#           Developer ID 키는 미니 밖으로 안 나간다. 검증을 못 넘으면 job 이 실패해 appcast 가 안 나간다.
#   ci    — 예전 길: CI 가 kasaterm-ci 자체 서명으로 굽는다(공증 없음 — Developer ID 설치본에는 자동 배포하지 않는다).
env:
  MAC_ARTIFACT: local
  MAC_TEAM: L366799VND
  # 이 실행이 다루는 릴리스 태그 — 태그 push 면 그 태그, 수동 마무리면 입력한 태그, 빌드 검증이면 빈 값.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '마무리할 기존 릴리스 태그(vX.Y.Z). 비우면 빌드 검증만'
        required: false
        default: ''
      platforms:
        description: 'both = mac·Windows 둘 다, macos = Windows 를 건드리지 않는 부분 게시'
        required: false
        default: both
        type: choice
        options:
          - both
          - macos
# 태그 마무리 실행은 「release vX.Y.Z (both|macos)」로 이름이 붙는다 — tools/release 가 이 이름으로 그 태그의 실행을 찾는다.
run-name: ${{ inputs.tag && format('release {0} ({1})', inputs.tag, inputs.platforms) || format('Release {0}', github.ref_name) }}

permissions:
  contents: write

jobs:
  build-msi:
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    steps:
      # 그림 에셋이 git-lfs 라 안 받으면 130바이트 포인터가 내려오고, build.rs 의 에셋 검사가 거기서 빌드를 세운다
      # (의도된 loud failure). 받는 것은 이 굽기가 쓰는 것만 — 폰 앱(mobile/)과 arona-ui 캐릭터 원본(character-src/,
      # vite 빌드가 안 읽는다)은 뺀다(126 MB → 약 80 MB). 빼는 목록 밖은 새 폴더가 생겨도 기본으로 받는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
          lfs: false

      # 그림은 GitHub LFS 가 아니라 미니의 읽기 전용 창구(tools/release/mini_lfs.py)에서 받는다 — GitHub LFS 대역폭 예산이
      # 막혀도 Windows 판이 서게(2026-09-27 v0.2.1). lfs.url·인증은 이 단계의 환경으로만 준다: 저장소 .lfsconfig 를 안 바꿔
      # 사람들의 push/pull 은 GitHub LFS 그대로고, 토큰은 체크아웃의 .git/config 에도 안 남는다.
      - name: Fetch LFS assets for the Windows build
        shell: bash
        env:
          MINI_LFS_URL: ${{ vars.MINI_LFS_URL }}
          MINI_LFS_TOKEN: ${{ secrets.MINI_LFS_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          [[ -n "$MINI_LFS_URL" && -n "$MINI_LFS_TOKEN" ]] || { echo "::error::변수 MINI_LFS_URL·비밀 MINI_LFS_TOKEN 이 없다 — 미니 LFS 창구를 못 부른다"; exit 1; }
          # 미니가 꺼졌거나(터널 530·502) 토큰이 틀렸으면(401) 받기 전에 멈춘다 — git lfs 의 재시도·자격 묻기로 흐려지지 않게.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/vnd.git-lfs+json' \
            -H "Authorization: Bearer $MINI_LFS_TOKEN" -d '{"operation":"download","transfers":["basic"],"objects":[]}' \
            "$MINI_LFS_URL/objects/batch" || true)"
          [[ "$CODE" == 200 ]] || { echo "::error::미니 LFS 창구가 받기를 거절했다(HTTP $CODE) — 미니·kasaterm 터널·토큰을 본다(scripts/mini-lfs.sh status)"; exit 1; }
          export GIT_CONFIG_COUNT=3 \
            GIT_CONFIG_KEY_0=lfs.url GIT_CONFIG_VALUE_0="$MINI_LFS_URL" \
            GIT_CONFIG_KEY_1="http.$MINI_LFS_URL.extraheader" GIT_CONFIG_VALUE_1="Authorization: Bearer $MINI_LFS_TOKEN" \
            GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2=''
          EXCLUDE='mobile/**,web/arona-ui/character-src/**'
          git lfs install --local
          git lfs pull --exclude="$EXCLUDE"
          # 받아야 할 그림이 하나라도 포인터로 남았으면 멈춘다 — 학생 그림 일부가 빈칸인 판을 내지 않는다.
          LEFT="$(git lfs ls-files | awk '$2 == "-"' | cut -d' ' -f3- | grep -vE '^(mobile/|web/arona-ui/character-src/)' || true)"
          [[ -z "$LEFT" ]] || { echo "::error::LFS 그림이 포인터로 남았다 ($(echo "$LEFT" | wc -l | tr -d ' ')개)"; echo "$LEFT" | head -20; exit 1; }

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 로컬과 CI가 다른 조립 경로를 쓰면 학생 로스터나 UI가 한쪽에서만 빠지는
      # 회귀를 놓치므로, payload 추출 검증까지 포함한 같은 스크립트를 호출한다.
      - name: Build and verify Windows packages
        shell: pwsh
        run: |
          # 해시테이블 splatting — 배열로 넘기면 "-ExpectedVersion" 이 이름이 아니라
          # 첫 위치 인자($Repo)로 들어가 경로 해석에서 선다.
          $arguments = @{}
          if ($env:RELEASE_TAG) {
            $arguments["ExpectedVersion"] = $env:RELEASE_TAG
          }
          & .\scripts\windows\package.ps1 @arguments

      - name: Locate Windows packages
        id: windows_packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist -Filter *-windows-x86_64.msi | Select-Object -First 1
          $zip = Get-ChildItem -Path dist -Filter *-windows-x86_64-portable.zip | Select-Object -First 1
          if (-not $msi -or -not $zip) { throw "Windows package output is incomplete" }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "msi_hash=$($msi.FullName).sha256" >> $env:GITHUB_OUTPUT
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_hash=$($zip.FullName).sha256" >> $env:GITHUB_OUTPUT
          "name=kasaterm-windows-x86_64" >> $env:GITHUB_OUTPUT
          Write-Host "built $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

      # 태그 push·태그 마무리 → 해당 릴리스에 MSI 첨부(릴리스 없으면 생성. 노트는 dmg job 이 채운다).
      - name: Attach Windows packages to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.windows_packages.outputs.msi }}
            ${{ steps.windows_packages.outputs.msi_hash }}
            ${{ steps.windows_packages.outputs.zip }}
            ${{ steps.windows_packages.outputs.zip_hash }}
          fail_on_unmatched_files: true

      # 빌드 검증 실행 → artifact 로만(릴리스 불변).
      - name: Upload Windows package artifacts
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows_packages.outputs.name }}
          path: |
            ${{ steps.windows_packages.outputs.msi }}
            ${{ steps.windows_packages.outputs.msi_hash }}
            ${{ steps.windows_packages.outputs.zip }}
            ${{ steps.windows_packages.outputs.zip_hash }}

  build-dmg:
    runs-on: macos-latest
    outputs:
      dmg_sha256: ${{ steps.verify_local.outputs.sha256 }}
    steps:
      # 그림 에셋이 git-lfs 라 lfs:true 가 없으면 130바이트 포인터가 내려오고,
      # build.rs 의 에셋 검사가 거기서 빌드를 세운다(의도된 loud failure).
      # 그림은 CI 가 mac 을 구울 때만 받는다. 로컬 dmg 검증은 Cargo.toml·릴리스 노트만 읽는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
          lfs: ${{ env.MAC_ARTIFACT == 'ci' || env.RELEASE_TAG == '' }}

      - name: Rust toolchain (stable)
        if: env.MAC_ARTIFACT == 'ci' || env.RELEASE_TAG == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        if: env.MAC_ARTIFACT == 'ci' || env.RELEASE_TAG == ''
        uses: Swatinem/rust-cache@v2

      # 태그와 Cargo.toml 버전이 어긋나면 CFBundleVersion 이 어긋나 Sparkle 의
      # 새 버전 판정이 꼬인다 — 빌드 전에 즉시 실패시킨다.
      - name: Verify tag matches Cargo.toml version
        if: env.RELEASE_TAG != ''
        run: |
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "v$CARGO_VER" != "$RELEASE_TAG" ]]; then
            echo "::error::Cargo.toml version($CARGO_VER) != tag($RELEASE_TAG) — scripts/tag-release.sh 로 릴리스할 것"
            exit 1
          fi

      # kasaterm-ci self-signed 인증서를 임시 키체인에 임포트 — build-app.sh 가
      # KASATERM_SIGN_ID 로 이 identity 를 찾아 서명한다. 고정 인증서라 업데이트를
      # 거듭해도 macOS TCC 권한이 유지된다(ad-hoc 은 빌드마다 재승인).
      - name: Import codesign certificate
        if: env.MAC_ARTIFACT == 'ci' || env.RELEASE_TAG == ''
        env:
          P12_B64: ${{ secrets.MAC_SIGN_P12 }}
          P12_PASS: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null

      # .app 번들(코드사인 + Sparkle.framework + arona-ui 포함) → dmg 스테이징.
      # Sparkle tarball 다운로드(build-app.sh 내부)가 gh 를 쓰므로 GH_TOKEN 필요.
      - name: Build .app + .dmg
        if: env.MAC_ARTIFACT == 'ci' || env.RELEASE_TAG == ''
        env:
          GH_TOKEN: ${{ github.token }}
          KASATERM_SIGN_ID: kasaterm-ci
        run: |
          bash scripts/build-app.sh
          VERSION="${RELEASE_TAG}"
          [[ "$VERSION" == v* ]] || VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')-dev"
          DMG="dist/kasaterm-$VERSION.dmg"
          STAGE="$(mktemp -d)"
          cp -R dist/kasaterm.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "kasaterm" -srcfolder "$STAGE" -ov -format UDZO "$DMG" >/dev/null
          rm -rf "$STAGE"
          echo "built $DMG ($(du -h "$DMG" | cut -f1))"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "DMG_NAME=$(basename "$DMG")" >> "$GITHUB_ENV"

      # 미니가 올린 dmg 를 기다렸다가 검증한다 — 해시는 릴리스 기록과 받은 파일로, 신원은 codesign·spctl·stapler 로.
      # 팀이 다르거나 공증이 없거나 판 번호가 태그와 다르면 실패 → appcast job 이 안 돈다.
      - name: Verify locally signed DMG
        id: verify_local
        if: env.MAC_ARTIFACT == 'local' && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG}"
          DMG_NAME="kasaterm-$VERSION.dmg"
          DL="$(mktemp -d)"
          for i in $(seq 1 120); do
            if gh release download "$VERSION" -p "$DMG_NAME" -D "$DL" --clobber 2>/dev/null; then break; fi
            [[ "$i" == 120 ]] && { echo "::error::60분 안에 $DMG_NAME 이 릴리스에 안 올라왔다 — 미니(tools/release)가 올린다"; exit 1; }
            sleep 30
          done
          DMG="$DL/$DMG_NAME"
          WANT="$(gh release view "$VERSION" --json assets -q ".assets[] | select(.name == \"$DMG_NAME\") | .digest")"
          GOT="sha256:$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          [[ "$WANT" == "$GOT" ]] || { echo "::error::받은 dmg 해시($GOT)가 릴리스 기록(${WANT:-없음})과 다르다"; exit 1; }
          spctl -a -t open --context context:primary-signature -vv "$DMG" > "$DL/dmg.spctl" 2>&1 || true
          cat "$DL/dmg.spctl"
          grep -q "source=Notarized Developer ID" "$DL/dmg.spctl" || { echo "::error::dmg 가 공증되지 않았다"; exit 1; }
          xcrun stapler validate "$DMG"
          MNT="$DL/mnt"; mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG" >/dev/null
          APP="$MNT/kasaterm.app"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | tee "$DL/app.codesign"
          grep -q "^TeamIdentifier=$MAC_TEAM$" "$DL/app.codesign" || { echo "::error::서명 팀이 $MAC_TEAM 이 아니다"; exit 1; }
          grep -q "^Authority=Developer ID Application: " "$DL/app.codesign" || { echo "::error::Developer ID 서명이 아니다"; exit 1; }
          grep -q "flags=.*runtime" "$DL/app.codesign" || { echo "::error::hardened runtime 이 아니다"; exit 1; }
          spctl -a -t execute -vv "$APP" 2>&1 | grep -q "source=Notarized Developer ID" || { echo "::error::앱이 공증되지 않았다"; exit 1; }
          PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          hdiutil detach "$MNT" >/dev/null
          [[ "v$PLIST_VER" == "$VERSION" ]] || { echo "::error::dmg 안 앱 판($PLIST_VER)이 태그($VERSION)와 다르다"; exit 1; }
          echo "verified $DMG_NAME — $GOT · 팀 $MAC_TEAM · 공증·staple"
          echo "sha256=${GOT#sha256:}" >> "$GITHUB_OUTPUT"

      # 태그 push → 릴리스에 dmg 첨부 + 설치 안내 노트(없으면 생성, msi job 과 선착순). local 이면 올리지 않고 노트만.
      - name: Attach DMG to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG}"
          # docs/release-notes/<태그>.md 가 있으면 그 판의 변경사항을 맨 앞에 싣는다.
          # 없으면 아래 설치 안내만 — 태그마다 워크플로를 고칠 필요가 없다.
          HIGHLIGHTS=""
          if [[ -f "docs/release-notes/$VERSION.md" ]]; then
            HIGHLIGHTS="$(cat "docs/release-notes/$VERSION.md")"$'\n\n---\n\n'
          fi
          if [[ "$MAC_ARTIFACT" == "local" ]]; then
            FIRST_RUN="3. 첫 실행 때 화면 녹화/접근 권한 물으면 허용"
          else
            FIRST_RUN=$'3. **처음 실행만**: Applications에서 kasaterm **우클릭 → 열기** → "열기" 확인\n   (직접 만든 앱이라 macOS가 한 번 확인받아요. 이후엔 그냥 더블클릭)\n4. 첫 실행 때 화면 녹화/접근 권한 물으면 허용'
          fi
          NOTES="$HIGHLIGHTS$(cat <<EOF
          kasaterm $VERSION — 한글 특화 GUI 터미널 + Claude 런처

          ## 설치 (macOS)
          1. \`kasaterm-$VERSION.dmg\` 다운로드 → 열기
          2. kasaterm을 Applications 폴더로 드래그
          $FIRST_RUN

          ## 설치 (Windows)
          \`.msi\` 다운로드 → 실행 (SmartScreen 경고 시 "추가 정보 → 실행")

          ## 쓰는 법
          앱 열면 바로 터미널. \`claude\` 치면 Claude Code 실행돼요.
          EOF
          )"
          if [[ "$MAC_ARTIFACT" == "local" ]]; then
            # dmg 는 미니가 올린 그대로 둔다(덮지 않는다) — 노트만 채운다.
            gh release edit "$VERSION" --title "kasaterm $VERSION" --notes "$NOTES"
          elif gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$DMG" --clobber
            gh release edit "$VERSION" --title "kasaterm $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" "$DMG" --title "kasaterm $VERSION" --notes "$NOTES"
          fi

      # 빌드 검증 실행 → artifact 로만(릴리스 불변).
      - name: Upload DMG artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG }}

  # msi + dmg 가 모두 릴리스에 올라온 뒤 appcast 2종을 서명·생성해 docs/ 로 커밋.
  # 설치된 앱들의 Sparkle(mac)/WinSparkle(win)이 이 Pages 피드를 보고 자동 업데이트한다.
  # mac 만 마무리(platforms=macos)면 build-msi 가 건너뛰어지므로 always() 로 들어와 결과를 직접 본다 — dmg 검증이 성공했고,
  # Windows 는 성공했거나(both) 일부러 건너뛴 경우(macos)에만 돈다. 실패·취소된 job 위로는 절대 안 돈다.
  appcast:
    needs: [build-msi, build-dmg]
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
      && needs.build-dmg.result == 'success'
      && (needs.build-msi.result == 'success' || (inputs.platforms == 'macos' && needs.build-msi.result == 'skipped'))
    runs-on: macos-latest
    steps:
      # docs/ 커밋은 main 에 올라가야 Pages 가 서빙한다(태그 detached 체크아웃 금지).
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sparkle signing tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPARKLE_VER="2.9.3"
          mkdir -p vendor/Sparkle
          gh release download "$SPARKLE_VER" --repo sparkle-project/Sparkle -p "Sparkle-$SPARKLE_VER.tar.xz" -D vendor --clobber
          tar -xJf "vendor/Sparkle-$SPARKLE_VER.tar.xz" -C vendor/Sparkle/

      - name: Generate + commit appcasts
        env:
          GH_TOKEN: ${{ github.token }}
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERIFIED_SHA: ${{ needs.build-dmg.outputs.dmg_sha256 }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          # 뒤의 git pull --rebase 가 LFS 그림을 받으려 들지 않게 — appcast 는 그림이 필요 없다.
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          VERSION="${RELEASE_TAG}"
          VER="${VERSION#v}"
          KEYFILE="$RUNNER_TEMP/ed.key"
          printf '%s' "$ED_KEY" > "$KEYFILE"

          # mac appcast — 릴리스의 dmg 를 받아 generate_appcast 로 서명·생성.
          ASSETS="$(mktemp -d)"
          gh release download "$VERSION" -p '*.dmg' -D "$ASSETS"
          # local 이면 build-dmg 가 검증한 바로 그 파일에만 EdDSA 를 단다 — 그 사이 바뀌었거나 dmg 가 둘이면 멈춘다.
          if [[ "$MAC_ARTIFACT" == "local" ]]; then
            [[ -n "$VERIFIED_SHA" ]] || { echo "::error::build-dmg 가 검증한 dmg 해시가 없다"; exit 1; }
            COUNT="$(find "$ASSETS" -name '*.dmg' | wc -l | tr -d ' ')"
            [[ "$COUNT" == 1 ]] || { echo "::error::릴리스에 dmg 가 $COUNT 개다"; exit 1; }
            GOT="$(shasum -a 256 "$ASSETS"/*.dmg | cut -d' ' -f1)"
            [[ "$GOT" == "$VERIFIED_SHA" ]] || { echo "::error::appcast 에 실을 dmg($GOT)가 검증한 것($VERIFIED_SHA)과 다르다"; exit 1; }
          fi
          vendor/Sparkle/bin/generate_appcast \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/2rami/kasaterm/releases/download/$VERSION/" \
            --link "https://github.com/2rami/kasaterm" \
            "$ASSETS"
          mkdir -p docs
          cp "$ASSETS/appcast.xml" docs/appcast.xml
          touch docs/.nojekyll

          # Windows appcast — 같은 EdDSA 키로 msi 서명. sign_update 출력이 그대로
          # enclosure 속성: sparkle:edSignature="..." length="..."
          # macos 부분 게시면 Windows 피드는 손대지 않는다(msi 가 없어도 지어내지 않는다).
          if [[ "$PLATFORMS" == "both" ]]; then
          gh release download "$VERSION" -p '*.msi' -O "$RUNNER_TEMP/win.msi"
          MSI_NAME="$(gh release view "$VERSION" --json assets -q '.assets[].name' | grep -E '\.msi$' | head -1)"
          SIG_LINE="$(vendor/Sparkle/bin/sign_update --ed-key-file "$KEYFILE" "$RUNNER_TEMP/win.msi")"
          cat > docs/appcast-win.xml <<XML
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>kasaterm (Windows)</title>
                  <item>
                      <title>$VER</title>
                      <pubDate>$(date -R)</pubDate>
                      <link>https://github.com/2rami/kasaterm</link>
                      <sparkle:version>$VER</sparkle:version>
                      <sparkle:shortVersionString>$VER</sparkle:shortVersionString>
                      <enclosure url="https://github.com/2rami/kasaterm/releases/download/$VERSION/$MSI_NAME"
                                 sparkle:os="windows" type="application/octet-stream" $SIG_LINE />
                  </item>
              </channel>
          </rss>
          XML
          fi
          rm -f "$KEYFILE" "$RUNNER_TEMP/win.msi"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "$PLATFORMS" == "both" ]]; then
            git add docs/appcast.xml docs/appcast-win.xml docs/.nojekyll
            git commit -m "chore(release): appcast $VERSION"
          else
            git add docs/appcast.xml docs/.nojekyll
            git commit -m "chore(release): appcast $VERSION (mac 만 — Windows 는 그대로)"
          fi
          # 태그 이후 main 이 움직였을 수 있다 — rebase 후 push.
          git pull --rebase origin main
          git push origin main
          echo "appcast → https://2rami.github.io/kasaterm/appcast.xml"
          echo "appcast-win → https://2rami.github.io/kasaterm/appcast-win.xml"
