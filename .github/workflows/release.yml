name: Release

# 태그(vX.Y.Z) push 하나로 릴리스 전체 자동화:
#   msi(Windows 러너) + dmg(macOS 러너) 빌드 → GitHub 릴리스 첨부 →
#   둘 다 끝나면 appcast 2종(EdDSA 서명)을 docs/ 에 커밋 → Pages 로 서빙.
# 로컬은 scripts/tag-release.sh 로 버전 bump + 태그 push 만 하면 된다.
# (scripts/release.sh 는 로컬 수동 폴백으로 유지.)
#
# 수동 실행(workflow_dispatch) → msi/dmg 빌드만 하고 artifact 로 올린다
# (태그·릴리스·appcast 불변, CI 검증용).
#
# Secrets:
#   SPARKLE_ED_PRIVATE_KEY — Sparkle EdDSA 개인키(appcast 서명, mac/win 공용)
#   MAC_SIGN_P12 / MAC_SIGN_P12_PASSWORD — kasaterm-ci self-signed codesign 인증서
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 로컬과 CI가 다른 조립 경로를 쓰면 학생 로스터나 UI가 한쪽에서만 빠지는
      # 회귀를 놓치므로, payload 추출 검증까지 포함한 같은 스크립트를 호출한다.
      - name: Build and verify Windows packages
        shell: pwsh
        run: |
          $arguments = @()
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $arguments += @("-ExpectedVersion", $env:GITHUB_REF_NAME)
          }
          & .\scripts\windows\package.ps1 @arguments

      - name: Locate Windows packages
        id: windows_packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist -Filter *-windows-x86_64.msi | Select-Object -First 1
          $zip = Get-ChildItem -Path dist -Filter *-windows-x86_64-portable.zip | Select-Object -First 1
          if (-not $msi -or -not $zip) { throw "Windows package output is incomplete" }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "msi_hash=$($msi.FullName).sha256" >> $env:GITHUB_OUTPUT
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_hash=$($zip.FullName).sha256" >> $env:GITHUB_OUTPUT
          "name=kasaterm-windows-x86_64" >> $env:GITHUB_OUTPUT
          Write-Host "built $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

      # 태그 push → 해당 릴리스에 MSI 첨부(릴리스 없으면 생성. 노트는 dmg job 이 채운다).
      - name: Attach Windows packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.windows_packages.outputs.msi }}
            ${{ steps.windows_packages.outputs.msi_hash }}
            ${{ steps.windows_packages.outputs.zip }}
            ${{ steps.windows_packages.outputs.zip_hash }}
          fail_on_unmatched_files: true

      # 수동 실행 → artifact 로만(릴리스 불변, 빌드 검증용).
      - name: Upload Windows package artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows_packages.outputs.name }}
          path: |
            ${{ steps.windows_packages.outputs.msi }}
            ${{ steps.windows_packages.outputs.msi_hash }}
            ${{ steps.windows_packages.outputs.zip }}
            ${{ steps.windows_packages.outputs.zip_hash }}

  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # 태그와 Cargo.toml 버전이 어긋나면 CFBundleVersion 이 어긋나 Sparkle 의
      # 새 버전 판정이 꼬인다 — 빌드 전에 즉시 실패시킨다.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "v$CARGO_VER" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Cargo.toml version($CARGO_VER) != tag($GITHUB_REF_NAME) — scripts/tag-release.sh 로 릴리스할 것"
            exit 1
          fi

      # kasaterm-ci self-signed 인증서를 임시 키체인에 임포트 — build-app.sh 가
      # KASATERM_SIGN_ID 로 이 identity 를 찾아 서명한다. 고정 인증서라 업데이트를
      # 거듭해도 macOS TCC 권한이 유지된다(ad-hoc 은 빌드마다 재승인).
      - name: Import codesign certificate
        env:
          P12_B64: ${{ secrets.MAC_SIGN_P12 }}
          P12_PASS: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null

      # .app 번들(코드사인 + Sparkle.framework + arona-ui 포함) → dmg 스테이징.
      # Sparkle tarball 다운로드(build-app.sh 내부)가 gh 를 쓰므로 GH_TOKEN 필요.
      - name: Build .app + .dmg
        env:
          GH_TOKEN: ${{ github.token }}
          KASATERM_SIGN_ID: kasaterm-ci
        run: |
          bash scripts/build-app.sh
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')-dev"
          DMG="dist/kasaterm-$VERSION.dmg"
          STAGE="$(mktemp -d)"
          cp -R dist/kasaterm.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "kasaterm" -srcfolder "$STAGE" -ov -format UDZO "$DMG" >/dev/null
          rm -rf "$STAGE"
          echo "built $DMG ($(du -h "$DMG" | cut -f1))"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "DMG_NAME=$(basename "$DMG")" >> "$GITHUB_ENV"

      # 태그 push → 릴리스에 dmg 첨부 + 설치 안내 노트(없으면 생성, msi job 과 선착순).
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # docs/release-notes/<태그>.md 가 있으면 그 판의 변경사항을 맨 앞에 싣는다.
          # 없으면 아래 설치 안내만 — 태그마다 워크플로를 고칠 필요가 없다.
          HIGHLIGHTS=""
          if [[ -f "docs/release-notes/$VERSION.md" ]]; then
            HIGHLIGHTS="$(cat "docs/release-notes/$VERSION.md")"$'\n\n---\n\n'
          fi
          NOTES="$HIGHLIGHTS$(cat <<EOF
          kasaterm $VERSION — 한글 특화 GUI 터미널 + Claude 런처

          ## 설치 (macOS)
          1. \`kasaterm-$VERSION.dmg\` 다운로드 → 열기
          2. kasaterm을 Applications 폴더로 드래그
          3. **처음 실행만**: Applications에서 kasaterm **우클릭 → 열기** → "열기" 확인
             (직접 만든 앱이라 macOS가 한 번 확인받아요. 이후엔 그냥 더블클릭)
          4. 첫 실행 때 화면 녹화/접근 권한 물으면 허용

          ## 설치 (Windows)
          \`.msi\` 다운로드 → 실행 (SmartScreen 경고 시 "추가 정보 → 실행")

          ## 쓰는 법
          앱 열면 바로 터미널. \`claude\` 치면 Claude Code 실행돼요.
          EOF
          )"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$DMG" --clobber
            gh release edit "$VERSION" --title "kasaterm $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" "$DMG" --title "kasaterm $VERSION" --notes "$NOTES"
          fi

      # 수동 실행 → artifact 로만(릴리스 불변, 빌드 검증용).
      - name: Upload DMG artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG }}

  # msi + dmg 가 모두 릴리스에 올라온 뒤 appcast 2종을 서명·생성해 docs/ 로 커밋.
  # 설치된 앱들의 Sparkle(mac)/WinSparkle(win)이 이 Pages 피드를 보고 자동 업데이트한다.
  appcast:
    needs: [build-msi, build-dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      # docs/ 커밋은 main 에 올라가야 Pages 가 서빙한다(태그 detached 체크아웃 금지).
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sparkle signing tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPARKLE_VER="2.9.3"
          mkdir -p vendor/Sparkle
          gh release download "$SPARKLE_VER" --repo sparkle-project/Sparkle -p "Sparkle-$SPARKLE_VER.tar.xz" -D vendor --clobber
          tar -xJf "vendor/Sparkle-$SPARKLE_VER.tar.xz" -C vendor/Sparkle/

      - name: Generate + commit appcasts
        env:
          GH_TOKEN: ${{ github.token }}
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VER="${VERSION#v}"
          KEYFILE="$RUNNER_TEMP/ed.key"
          printf '%s' "$ED_KEY" > "$KEYFILE"

          # mac appcast — 릴리스의 dmg 를 받아 generate_appcast 로 서명·생성.
          ASSETS="$(mktemp -d)"
          gh release download "$VERSION" -p '*.dmg' -D "$ASSETS"
          vendor/Sparkle/bin/generate_appcast \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/2rami/kasaterm/releases/download/$VERSION/" \
            --link "https://github.com/2rami/kasaterm" \
            "$ASSETS"
          mkdir -p docs
          cp "$ASSETS/appcast.xml" docs/appcast.xml
          touch docs/.nojekyll

          # Windows appcast — 같은 EdDSA 키로 msi 서명. sign_update 출력이 그대로
          # enclosure 속성: sparkle:edSignature="..." length="..."
          gh release download "$VERSION" -p '*.msi' -O "$RUNNER_TEMP/win.msi"
          MSI_NAME="$(gh release view "$VERSION" --json assets -q '.assets[].name' | grep -E '\.msi$' | head -1)"
          SIG_LINE="$(vendor/Sparkle/bin/sign_update --ed-key-file "$KEYFILE" "$RUNNER_TEMP/win.msi")"
          cat > docs/appcast-win.xml <<XML
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>kasaterm (Windows)</title>
                  <item>
                      <title>$VER</title>
                      <pubDate>$(date -R)</pubDate>
                      <link>https://github.com/2rami/kasaterm</link>
                      <sparkle:version>$VER</sparkle:version>
                      <sparkle:shortVersionString>$VER</sparkle:shortVersionString>
                      <enclosure url="https://github.com/2rami/kasaterm/releases/download/$VERSION/$MSI_NAME"
                                 sparkle:os="windows" type="application/octet-stream" $SIG_LINE />
                  </item>
              </channel>
          </rss>
          XML
          rm -f "$KEYFILE" "$RUNNER_TEMP/win.msi"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml docs/appcast-win.xml docs/.nojekyll
          git commit -m "chore(release): appcast $VERSION"
          # 태그 이후 main 이 움직였을 수 있다 — rebase 후 push.
          git pull --rebase origin main
          git push origin main
          echo "appcast → https://2rami.github.io/kasaterm/appcast.xml"
          echo "appcast-win → https://2rami.github.io/kasaterm/appcast-win.xml"
