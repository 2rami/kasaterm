[package]
name = "pty-backend"
description = "Direct PTY + alacritty_terminal backend. Phase C replacement for tmux-bridge so tmuxify can run natively on Windows (via portable-pty's ConPTY) and stop depending on a tmux daemon."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
portable-pty = "0.9"
alacritty_terminal = "0.26"
# Shared cell / color / ScreenUpdate types — tmuxify's renderer is
# already keyed off these and we want pty-backend to be drop-in
# compatible with tmux-bridge. The tmux-bridge crate itself stops
# being a runtime dependency once Phase D lands (kasaterm-cli +
# tmux-bridge can be retired); the type re-use here is just the
# shared vocabulary the renderer speaks.
tmux-bridge.workspace = true
arboard = "3"
# NFC-normalize PTY output so decomposed (NFD) Hangul jamo collapse into
# precomposed syllables. cosmic_text (sugarloaf path) shaped jamo back
# together automatically; the swash/cell-renderer GPU path draws one
# glyph per codepoint, so NFD shows as split jamo without this.
unicode-normalization = "0.1"
# Inline image support (iTerm2 OSC 1337). base64-decode the payload, then
# decode PNG/JPEG/GIF/etc into RGBA8 for GPU upload. Default features off
# keeps the codec set lean; we enable just the common web formats.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
