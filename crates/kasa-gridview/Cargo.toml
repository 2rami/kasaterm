[package]
name = "kasa-gridview"
description = "Draws terminal panes for kasaterm and kasalite: cell grid, cursor, selection, IME preedit, inline images, palette, font lookup, macOS layer and frame pacing."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
kasa-screen.workspace = true
kasa-cells = { path = "../kasa-cells" }
# noop: CPU 렌더(soft.rs)가 드라이버 없이 장치·큐만 세울 때 쓴다.
wgpu = { version = "28", features = ["noop"] }
wgpu-hal = { version = "28", features = ["metal"] }
winit = "0.30"
raw-window-handle = "0.6"
anyhow.workspace = true
pollster = "0.4"
# GPU 없는 기계에서 CPU 로 칠한 화면을 창에 내보낸다(X11 은 XShm). kms 는 창이 아니라 쓰지 않는다.
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# P3 레이어 손질이 `setColorspace:` 에 CGColorSpaceRef 를 `*mut c_void` 로 넘긴다 — 디버그 빌드의 인자 타입 검사가
# 그 자리를 막지 않게 한다(본판은 다른 의존이 켜 줘서 드러나지 않았다).
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
