[package]
name = "kasa-gridview"
description = "Draws terminal panes for kasaterm and kasalite: cell grid, cursor, selection, IME preedit, inline images, palette, font lookup, macOS layer and frame pacing."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
kasa-screen.workspace = true
kasa-cells = { path = "../kasa-cells" }
wgpu = "28"
wgpu-hal = { version = "28", features = ["metal"] }
winit = "0.30"
raw-window-handle = "0.6"
anyhow.workspace = true
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
