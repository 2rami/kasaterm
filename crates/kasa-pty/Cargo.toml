[package]
name = "kasa-pty"
description = "Direct PTY + alacritty_terminal backend. Phase C replacement for kasa-bridge so kasaterm can run natively on Windows (via portable-pty's ConPTY) and stop depending on a tmux daemon."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
# Serialize the BSP layout tree so the daemon can ship it to an attaching GUI.
serde.workspace = true
portable-pty = "0.9"
alacritty_terminal = "0.26"
# Shared cell / color / ScreenUpdate types — kasaterm's renderer is
# already keyed off these and we want kasa-pty to be drop-in
# compatible with kasa-bridge. The kasa-bridge crate itself stops
# being a runtime dependency once Phase D lands (kasaterm-cli +
# kasa-bridge can be retired); the type re-use here is just the
# shared vocabulary the renderer speaks.
kasa-bridge.workspace = true
arboard = "3"
# NFC-normalize PTY output so decomposed (NFD) Hangul jamo collapse into
# precomposed syllables. cosmic_text (sugarloaf path) shaped jamo back
# together automatically; the swash/cell-renderer GPU path draws one
# glyph per codepoint, so NFD shows as split jamo without this.
unicode-normalization = "0.1"
# Fast SIMD substring search — used in the reader hot path to short-circuit
# the OSC 1337 / kitty graphics scans when neither prefix is present.
memchr = "2"

# Windows has no `ps`: enumerate the process table (pid/ppid/exe name) via a
# Toolhelp snapshot, and read a single process's argv out of its PEB over
# ReadProcessMemory — so active_process_name / has_active_job / claude session
# id detection work natively.
# 핸드오프(산 채로 fd 넘기기): poll 기반 reader 정지·TIOCSWINSZ·dup·kill.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
] }
