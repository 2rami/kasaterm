[package]
name = "kasa-http"
description = "Local HTTP host composition for panes, screens and desktop APIs."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
futures-util = { workspace = true }
kasa-agents = { workspace = true }
kasa-characters = { workspace = true }
kasa-collab = { workspace = true, features = ["net"] }
kasa-device = { workspace = true }
kasa-git = { workspace = true }
kasa-pty = { workspace = true, default-features = true }
kasa-remote = { workspace = true }
kasa-screen = { workspace = true }
kasa-socket = { workspace = true, default-features = true }
kasa-students = { workspace = true }
kasa-wire = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
kasa-remote = { workspace = true, features = ["test-isolation"] }
kasa-students = { workspace = true, features = ["test-isolation"] }
kasa-device = { workspace = true, features = ["test-isolation"] }
libc.workspace = true
kasa-socket = { workspace = true, features = ["test-support"] }
kasa-backend = { workspace = true, features = ["test-support"] }
kasa-collab = { workspace = true, features = ["net", "test-support"] }

[lints]
workspace = true
