[package]
name = "kasa-acp"
description = "Agent Client Protocol client: drives Claude Code and Codex through their ACP adapters over stdio JSON-RPC, so the host reads turn ends, tool calls, context use and permission requests as events instead of guessing from the terminal screen."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

# 어댑터는 npx → node → codex app-server 처럼 손자 프로세스를 낳는다. 직속 자식만 죽이면
# 손자가 고아로 남으니 프로세스 그룹째 신호를 보낸다.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows 콘솔의 Ctrl-C 는 신호가 아니라 콘솔 제어 이벤트다 — runner 가 턴만 멈추려면 처리기를 단다.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
