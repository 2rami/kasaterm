[package]
name = "kasa-remote"
description = "Remote panes, device transport adapters, mirroring and repository transfer."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
test-isolation = ["kasa-device/test-isolation"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
futures-util = { workspace = true }
kasa-device = { workspace = true }
kasa-identity = { workspace = true }
kasa-pty = { workspace = true, default-features = true }
kasa-socket = { workspace = true, default-features = true }
kasa-wire = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
kasa-device = { workspace = true, features = ["test-isolation"] }

[lints]
workspace = true
