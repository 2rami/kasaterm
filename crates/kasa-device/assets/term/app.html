<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kasaterm</title>
<style>
  /* 하단바 「기기」 QR 을 찍은 폰이 처음 보는 화면 — 앱 열기·설치·웹 보기 세 갈래. 겉모습은 설치 페이지와 같은
     web_look(__OS_CSS__ 자리), 단추는 엄지 크기. */
__OS_CSS__
</style>
</head>
<body>
__OS_BAR__
<main class="os">
  <section class="card">
    <h1>이 맥의 학생들을 폰에서</h1>
    <p class="dim">앱이 있으면 앱으로, 없으면 웹에서 바로 볼 수 있어요.</p>
    <a class="btn" id="open" href="#">앱으로 열기</a>
    <a class="btn ghost" id="web" href="#">웹에서 보기</a>
  </section>
  <section class="card">
    <h2>앱 설치</h2>
    <p class="dim" id="install-note" hidden>폰·아이패드에 카사텀 앱을 깔아요. 처음이면 기기 등록부터 안내해요.</p>
    <a class="btn ghost" id="install" href="__INSTALL_URL__" hidden>설치 페이지 열기</a>
    <p class="dim" id="no-install" hidden>설치 링크가 아직 없어요 — 맥에 케이블로 꽂아 설치해요. 이미 깔려 있으면 위 「앱으로 열기」.</p>
  </section>
</main>
<script>
// `/u/<slug>/app`(폰) 또는 `/app`(로컬) 로 열린다. 그 접두가 곧 자격이라 링크 전부가
// 그걸 물려받아야 한다 — 허브(hub.html)와 같은 규칙.
const ROOT = location.pathname.replace(/\/app$/, '');
const $ = (id) => document.getElementById(id);
const root = `${location.origin}${ROOT}/`;
$('web').href = root;
const install = $('install');
if (install.getAttribute('href')) { install.hidden = false; $('install-note').hidden = false; } else $('no-install').hidden = false;

// 앱 스킴은 앱이 없는 폰에서 사파리 경고를 띄운다 — 단추로만 가고, 한 번 성공한 폰은
// 허브와 같은 표식을 공유해 다음부터 저절로 간다.
const link = `kasaterm://open?root=${encodeURIComponent(root)}`;
const KEY = 'kasaterm-app';
const go = () => {
  location.href = link;
  setTimeout(() => {
    if (document.visibilityState === 'hidden') localStorage.setItem(KEY, '1');
    else localStorage.removeItem(KEY);
  }, 1500);
};
$('open').addEventListener('click', (e) => { e.preventDefault(); go(); });
if (localStorage.getItem(KEY) === '1') go();
</script>
</body>
</html>
