[package]
name = "kasa-students"
description = "Student dispatch, teams, schedules and harness control."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
test-isolation = ["kasa-device/test-isolation"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
kasa-agents = { workspace = true }
kasa-characters = { workspace = true }
kasa-collab = { workspace = true, features = ["net"] }
kasa-device = { workspace = true }
kasa-pty = { workspace = true, default-features = true }
kasa-socket = { workspace = true, default-features = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[dev-dependencies]
kasa-device = { workspace = true, features = ["test-isolation"] }
kasa-socket = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
