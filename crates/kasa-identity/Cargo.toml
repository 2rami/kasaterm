[package]
name = "kasa-identity"
description = "Shared account identity, OAuth and sealed credentials for device clients and the gateway."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
kasa-socket = { workspace = true, default-features = true }
libc = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Credentials"] }

[lints]
workspace = true
