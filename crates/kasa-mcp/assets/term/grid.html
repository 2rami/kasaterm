<!doctype html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>kasaterm</title>
<!-- 상대 경로 — 이 페이지는 `/term/grid` 로도, 유저 주소 `/u/<slug>/term/grid` 로도,
     다른 기계 `/u/<slug>/m/<기계>/term/grid` 로도 열린다. 절대 `/term/…` 로 적으면
     뒤의 둘에서 자격 없는 요청이 되어 403 이다. -->
<link rel="stylesheet" href="grid.css">
<style>
  html,body{margin:0;background:#12161c;color:#c8d0d9;
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}
  #wrap{position:fixed;left:0;right:0;top:0;
    bottom:calc(44px + env(safe-area-inset-bottom) + var(--keyboard-inset,0px));
    overflow:auto;-webkit-overflow-scrolling:touch}
  /* 그림 모드 — PNG 를 폰 폭에 맞춰 두고 두 손가락으로 키운다. 브라우저 핀치는 메타로
     꺼 두었으므로(입력창 포커스 때 화면이 튀는 것을 막는다) 배율은 우리가 잰다. */
  #shotwrap{position:fixed;left:0;right:0;top:0;bottom:calc(44px + env(safe-area-inset-bottom) + var(--keyboard-inset,0px));
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#12161c}
  #shot{display:block;width:100%;max-width:none;user-select:none;-webkit-user-select:none}
  #shotnote{position:absolute;left:0;right:0;top:0;padding:10px 12px;background:#1a2130;color:#e0af68;font-size:13px}
  body.picture-mode #shotwrap{bottom:calc(100px + env(safe-area-inset-bottom) + var(--keyboard-inset,0px))}
  .kg-input.picture-input{position:fixed;top:auto;left:10px;right:10px;
    bottom:calc(52px + env(safe-area-inset-bottom) + var(--keyboard-inset,0px));
    box-sizing:border-box;width:calc(100% - 20px);height:42px;padding:10px 12px;
    border:1px solid #46546a;border-radius:8px;background:#1a2130;color:#c8d0d9;
    caret-color:#7aa2f7;font-size:16px;line-height:20px;z-index:3}
  #status{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;
    padding:0 6px;padding-bottom:env(safe-area-inset-bottom);min-height:44px;background:#1a2130;
    font-size:12px;color:#7aa2f7}
  #status a,#status button{display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;
    padding:0 10px;color:#c8d0d9;text-decoration:none;background:none;border:0;font:inherit}
  #status button.on{color:#7aa2f7;text-shadow:0 0 6px #7aa2f7}
  #st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<link rel="stylesheet" href="chrome.css">
<a id="term-heading" class="term-heading" href="./" aria-label="세션 목록">
  <span class="term-avatar"><img id="avatar" alt=""><span id="ahole"></span></span>
  <span class="term-labels"><span id="who">터미널</span><span id="whot"></span></span>
  <span class="term-context"><span id="machine-badge"><span id="machine-name"></span></span><span id="model-label"></span><span id="pane-state"></span></span>
  <svg id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</a>
<div id="wrap"></div>
<div id="shotwrap" hidden><img id="shot" alt=""><div id="shotnote" hidden></div></div>
<div id="status">
  <a id="hub" href="./">≡ 목록</a>
  <span id="st">연결 중…</span>
  <button id="pic" type="button" title="데스크톱이 그리는 그대로(테마·폰트) 보기">그림</button>
  <button id="app" type="button" title="이 학생을 앱에서 열기" hidden>앱</button>
</div>
<script src="grid.js"></script>
<script src="viewport.js"></script>
<script src="chrome.js"></script>
<script>
// 주소 접두(`/u/<slug>` · `/u/<slug>/m/<기계>` · 없음)를 그대로 물려받는다 — WS 도 같은 문으로.
const ROOT = location.pathname.replace(/\/term\/grid\/?$/, '');
// 허브: 유저 주소 아래면 그 뿌리(`/u/<slug>/`), 로컬이면 `/hub`.
const hubRoot = ROOT.replace(/\/m\/[^/]+$/, '');
document.getElementById('hub').href = hubRoot ? `${hubRoot}/` : '/hub';
document.getElementById('term-heading').href = document.getElementById('hub').href;
// 아이폰이면 이 학생을 앱에서 연다(kasaterm:// 스킴). 규율은 허브와 같다 — 처음엔 단추,
// 한 번 성공한 뒤부터 저절로. 슬랙 알림 링크로 들어와도 앱으로 넘어간다.
(function appJump() {
  if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
  const btn = document.getElementById('app');
  const m = ROOT.match(/\/m\/([^/]+)$/);
  const q = new URLSearchParams({ root: `${location.origin}${hubRoot}/` });
  if (m) q.set('machine', decodeURIComponent(m[1]));
  const pane = new URLSearchParams(location.search).get('pane');
  if (pane) q.set('pane', pane);
  const link = `kasaterm://open?${q}`;
  const KEY = 'kasaterm-app';
  const go = () => {
    location.href = link;
    setTimeout(() => {
      if (document.visibilityState === 'hidden') localStorage.setItem(KEY, '1');
      else localStorage.removeItem(KEY);
    }, 1500);
  };
  btn.hidden = false;
  btn.addEventListener('click', go);
  if (localStorage.getItem(KEY) === '1') go();
})();
const st = document.getElementById('st');
const wrap = document.getElementById('wrap');
const shotwrap = document.getElementById('shotwrap');
const shot = document.getElementById('shot');
const shotnote = document.getElementById('shotnote');
const picBtn = document.getElementById('pic');
const grid = KasaGrid(wrap);
const chrome = KasaTermChrome.create({ root: ROOT, onTheme: tokens => grid.setTheme(tokens) });
const enc = new TextEncoder();
// 키 입력은 바이너리 프레임으로만 간다 — 텍스트 프레임은 resize JSON 으로 읽혀 버려진다.
const send = (s) => { if (ws && ws.readyState === 1) ws.send(enc.encode(s)); };
// 서버가 프레임마다 알려주는 입력 모드. xterm 은 이걸 자기가 추적했지만, 파싱한 쪽이
// 알려주므로 어긋날 자리가 없다.
const modes = { appCursor: false, bracketedPaste: false };
const input = KasaGridInput(grid, send, modes);
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
// 쿼리를 재조립하지 않고 그대로 넘긴다 — pane id 의 `%` 가 여기서 또 깎일 자리다.
const sep = location.search ? '&' : '?';
const WS_URL = `${proto}://${location.host}${ROOT}/term/ws${location.search}${sep}grid=1`;
let ws = null;
let frames = 0;
let isMirror = false;
let lastCursor = [0, 0];
let gone = false, backoff = 1000, retryTimer = null, sentView = 0;
const viewport = KasaViewport.create({
  measure: () => {
    const area = KasaViewport.visibleArea(picture ? shotwrap : wrap);
    const cell = grid.cell;
    return cell.w > 0 && cell.h > 0
      ? { cols: Math.floor(area.width / cell.w), rows: Math.floor(area.height / cell.h) }
      : null;
  },
});
function connect() {
  if (gone || document.visibilityState !== 'visible') return;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  clearTimeout(retryTimer);
  st.textContent = '연결 중…';
  const socket = new WebSocket(WS_URL);
  ws = socket;
  viewport.bind(socket);
  sentView = 0;
  isMirror = false;
  socket.onmessage = (e) => {
    if (ws !== socket || typeof e.data !== 'string') return;
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'grid') {
      grid.apply(m);
      modes.appCursor = m.appCursor;
      modes.bracketedPaste = m.bracketedPaste;
      lastCursor = m.cursor;
      frames++;
      st.textContent = '연결됨';
      syncSize();
      syncView();
      fitWidth();
      placeInput();
      if (picture) { shotDue = true; takeShot(); }
    } else if (m.t === 'size') {
      isMirror = !!m.mirror;
      viewport.receive(m, socket);
      if (m.id) chrome.setPane(m.id);
      st.textContent = '연결됨';
      syncView();
    } else if (m.t === 'viewport') {
      viewport.receive(m, socket);
      fitWidth();
    } else if (m.t === 'gone') {
      gone = true;
      viewport.release();
      st.textContent = '세션이 끝났어요 — ≡ 목록에서 다른 pane 을 고르세요';
    }
  };
  socket.onopen = () => {
    if (ws !== socket) return;
    backoff = 1000;
    grid.remeasure();
    input.focus();
    syncSize();
    if (picture) { shotDue = true; takeShot(); }
  };
  socket.onclose = (e) => {
    if (ws !== socket) return;
    viewport.disconnected(socket);
    ws = null;
    if (gone) return;
    st.textContent = '연결이 끊겼어요 — 다시 연결 중…';
    schedule();
  };
  socket.onerror = () => {};
}
function schedule() {
  clearTimeout(retryTimer);
  if (document.visibilityState !== 'visible') return;
  retryTimer = setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 10000);
}
document.addEventListener('visibilitychange', () => {
  viewport.visibilityChanged();
  if (document.visibilityState === 'visible') {
    backoff = 1000; connect(); syncSize();
    if (picture) { shotDue = true; takeShot(); }
  }
});
addEventListener('online', () => { backoff = 1000; connect(); });
addEventListener('pageshow', () => { connect(); viewport.visibilityChanged(); });
addEventListener('pagehide', () => {
  viewport.release();
  const socket = ws;
  viewport.disconnected(socket);
  ws = null;
  socket?.close();
  clearTimeout(retryTimer);
});

// zoom changes the layout box as well as pixels, preserving DOM input coordinates.
function fitWidth() {
  const area = KasaViewport.visibleArea(wrap);
  const needW = grid.cols * grid.cell.w, needH = grid.rows * grid.cell.h;
  if (picture || !needW || !needH || !area.width || !area.height) return;
  const scale = Math.min(1, area.width / needW, area.height / needH);
  grid.el.style.zoom = scale < 1 ? scale : '';
}
function syncSize() { viewport.schedule(); }

// Only old hosts use server-side text reflow; a leased grid must remain authoritative.
function syncView() {
  if (!ws || ws.readyState !== 1 || !viewport.state().ready || !isMirror || !grid.cell.w) return;
  const cols = picture || viewport.state().capable ? 0
    : Math.max(20, Math.floor(KasaViewport.visibleArea(wrap).width / grid.cell.w));
  if (cols === sentView) return;
  sentView = cols;
  ws.send(JSON.stringify({ t: 'view', cols }));
}
function syncLayout() {
  const vv = window.visualViewport;
  const hidden = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
  document.documentElement.style.setProperty('--keyboard-inset', `${hidden}px`);
  document.getElementById('status').style.transform = `translateY(${-hidden}px)`;
  grid.remeasure();
  syncSize(); syncView(); fitWidth(); fitPicture(); placeInput();
}
addEventListener('resize', syncLayout);
window.visualViewport?.addEventListener('resize', syncLayout);
window.visualViewport?.addEventListener('scroll', syncLayout);
document.fonts?.ready.then(syncLayout);
document.fonts?.addEventListener('loadingdone', syncLayout);

// ── 그림 모드 ──
// 격자 화면은 셀을 브라우저 폰트로 다시 그려 테마·폰트·프사가 데스크톱과 다르다. 그림
// 모드는 데스크톱이 실제로 그린 프레임(PNG)을 받아 그대로 보인다 — 나쵸 알림 사진과
// 같은 경로다. 입력은 그대로 격자 소켓으로 가고, 격자 프레임이 「화면이 바뀌었다」는
// 신호로만 쓰인다. 한 장에 데스크톱 한 프레임이라 400ms 에 한 장을 넘지 않고, 받는
// 중엔 겹쳐 부르지 않는다.
let picture = false;
let zoom = 1;
let shotBusy = false, shotDue = false, shotAt = 0, shotTimer = null;
const SHOT_MIN_MS = 400;
function shotNote(msg) {
  shotnote.hidden = !msg;
  shotnote.textContent = msg || '';
}
async function takeShot() {
  if (!picture || document.visibilityState !== 'visible') return;
  if (shotBusy) { shotDue = true; return; }
  const wait = SHOT_MIN_MS - (Date.now() - shotAt);
  if (wait > 0) { clearTimeout(shotTimer); shotTimer = setTimeout(takeShot, wait); return; }
  shotBusy = true; shotDue = false; shotAt = Date.now();
  const socket = ws;
  try {
    const r = await fetch(`${ROOT}/term/shot${location.search}${sep}w=0&n=${shotAt}`, { cache: 'no-store' });
    if (!r.ok) {
      const why = (await r.text()).trim();
      // 격자 없는 헤드리스 셸이나 가려진 pane — 글자 화면으로 돌아간다.
      if (r.status === 503 && !shot.src) { setPicture(false); st.textContent = `그림이 없는 pane 이에요 — ${why}`; }
      else shotNote(`그림 갱신 실패 — ${why}`);
      return;
    }
    const blob = await r.blob();
    if (!picture || ws !== socket) return;
    const url = URL.createObjectURL(blob);
    const old = shot.src;
    shot.src = url;
    if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    shotNote('');
  } catch (e) {
    shotNote('그림을 못 받았어요 — 연결을 확인하세요');
  } finally {
    shotBusy = false;
    if (shotDue) takeShot();
  }
}
// PNG는 pane 여백과 크롬을 포함할 수 있어 논리 셀 좌표를 역산할 수 없다.
// 그림에서는 읽을 수 있는 고정 입력칸, 글자에서는 원래 커서 위치를 쓴다.
function placeInput() {
  const [row, col] = lastCursor;
  if (!picture) { input.moveTo(row, col); return; }
  input.el.style.transform = 'none';
  input.el.style.height = '42px';
}
function fitPicture() {
  if (!picture || !shot.naturalWidth || !shot.naturalHeight) return;
  const area = KasaViewport.visibleArea(shotwrap);
  const scale = Math.min(area.width / shot.naturalWidth, area.height / shot.naturalHeight);
  if (scale > 0) shot.style.width = `${shot.naturalWidth * scale * zoom}px`;
}
shot.addEventListener('load', () => { fitPicture(); placeInput(); });
function setPicture(on) {
  picture = on;
  document.body.classList.toggle('picture-mode', on);
  input.el.classList.toggle('picture-input', on);
  input.el.placeholder = on ? '터미널에 입력' : '';
  input.el.setAttribute('aria-label', on ? '그림 보기 터미널 입력' : '터미널 입력');
  wrap.hidden = on;
  shotwrap.hidden = !on;
  picBtn.textContent = on ? '글자' : '그림';
  picBtn.classList.toggle('on', on);
  // 입력창은 보이는 쪽에 있어야 포커스가 잡힌다(display:none 안의 요소는 포커스 불가).
  (on ? shotwrap : grid.el).appendChild(input.el);
  grid.remeasure();
  syncSize(); syncView(); fitWidth(); fitPicture();
  placeInput();
  if (on) { shotDue = true; takeShot(); }
  input.focus();
  try { localStorage.setItem('kasa-picture', on ? '1' : '0'); } catch (e) {}
}
picBtn.addEventListener('click', () => setPicture(!picture));
shotwrap.addEventListener('pointerup', () => input.focus());
// 두 손가락 핀치 — 폰 폭에 맞춘 1배에서 6배까지. 한 손가락 스크롤은 브라우저 것이다.
let pinch = null;
const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
shotwrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zoom };
}, { passive: true });
shotwrap.addEventListener('touchmove', (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  zoom = Math.min(6, Math.max(1, pinch.z * dist(e.touches) / pinch.d));
  fitPicture();
  placeInput();
}, { passive: false });
shotwrap.addEventListener('touchend', () => { pinch = null; });
// 마지막 선택을 기억한다 — 매번 「그림」을 다시 누르게 하지 않는다. `?pic=1` 이 우선.
{
  let want = false;
  try { want = localStorage.getItem('kasa-picture') === '1'; } catch (e) {}
  if (new URLSearchParams(location.search).get('pic') === '1') want = true;
  if (want) setPicture(true);
}
syncLayout();
connect();
</script>
