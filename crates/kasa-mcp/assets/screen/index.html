<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화면</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0e11; color: #e8e8ec;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage.actual { display: block; overflow: auto; }
  canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: auto; }
  #stage.actual canvas { max-width: none; max-height: none; }
  #bar { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; align-items: center;
    padding: 4px 6px 4px 10px; border-radius: 8px; background: rgba(20, 21, 26, .82);
    border: 1px solid rgba(255, 255, 255, .08); backdrop-filter: blur(8px); opacity: .9; transition: opacity .2s; }
  #bar:hover { opacity: 1; }
  #state { color: #a6a7b0; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #state.live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: #3ecf8e; vertical-align: 1px; }
  button, select { font: inherit; color: inherit; background: rgba(255, 255, 255, .06); height: 26px;
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 6px; padding: 0 8px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255, 255, 255, .12); }
  #note { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; }
  #note.on { display: flex; }
  #note div { max-width: 460px; padding: 18px 20px; border-radius: 10px; background: #17181d;
    border: 1px solid rgba(255, 255, 255, .08); }
  #note b { display: block; margin-bottom: 6px; font-size: 14px; }
  #note p { margin: 0; color: #a6a7b0; }
  #stage.control canvas { outline: 2px solid #4c8dff; outline-offset: -2px; cursor: default; }
  #control[aria-pressed="true"] { background: rgba(76, 141, 255, .28); border-color: rgba(76, 141, 255, .6); }
  #keys { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
  #inputNote { position: fixed; left: 10px; right: 10px; bottom: 10px; display: none; padding: 10px 12px; border-radius: 8px;
    background: #2a1d1d; border: 1px solid rgba(255, 120, 120, .3); color: #f1c9c9; }
  #inputNote.on { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="0" height="0"></canvas></div>
<div id="bar">
  <span id="state">연결 중</span>
  <select id="display" hidden title="화면 고르기"></select>
  <button id="control" aria-pressed="false" title="그 기기를 누르고 치기 — 끄면 보기만">조작</button>
  <button id="fit" title="창에 맞추기 / 실제 크기">실제 크기</button>
</div>
<textarea id="keys" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="inputNote"></div>
<div id="note"><div><b id="noteTitle"></b><p id="noteBody"></p></div></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  if (name) document.title = `화면 · ${name}`;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const state = document.getElementById('state');
  const pickDisplay = document.getElementById('display');
  const fitButton = document.getElementById('fit');
  const note = document.getElementById('note');
  const NOTES = {
    permission: ['화면 기록 권한이 필요해요',
      '그 기기에서 시스템 설정 › 개인정보 보호 및 보안 › 화면 및 시스템 오디오 녹음에서 kasaterm 을 켠 뒤 카사텀을 다시 열어 주세요. 켜지면 여기 화면이 저절로 들어와요.'],
    unavailable: ['이 기기는 화면을 보낼 수 없어요', '화면이 없는 기기이거나 화면 거울이 없는 옛 판이에요.'],
  };
  let ws = null, retry = 1, display = null, frames = [], shown = null;
  const controlButton = document.getElementById('control');
  const keys = document.getElementById('keys');
  const inputNote = document.getElementById('inputNote');
  const INPUT_NOTES = {
    permission: '그 기기의 카사텀에 손쉬운 사용 권한이 없어 조작이 안 들어가요. 그 기기에서 시스템 설정 › 개인정보 보호 및 보안 › 손쉬운 사용에서 kasaterm 을 켜 주세요. 켜면 바로 먹어요.',
    unavailable: '이 기기는 조작을 받을 수 없어요. 조작이 없는 옛 판이거나 지원하지 않는 OS 예요.',
  };
  let controlling = false;
  const send = m => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m)); };

  // 창 픽셀만큼만 받는다 — 더 크게 받아 봐야 관문 길만 무거워진다.
  const want = () => {
    const ratio = window.devicePixelRatio || 1;
    const edge = v => Math.min(3840, Math.max(320, Math.round(v * ratio / 160) * 160));
    return { w: edge(innerWidth), h: edge(innerHeight) };
  };
  let asked = want();

  function say(text, live) {
    state.textContent = text;
    state.classList.toggle('live', !!live);
  }

  function showNote(reason) {
    const n = NOTES[reason];
    note.classList.toggle('on', !!n);
    if (!n) return;
    document.getElementById('noteTitle').textContent = n[0];
    document.getElementById('noteBody').textContent = n[1];
  }

  function connect() {
    const url = new URL('screen/ws', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    url.search = '';
    url.searchParams.set('w', asked.w);
    url.searchParams.set('h', asked.h);
    url.searchParams.set('q', 70);
    url.searchParams.set('fps', 10);
    if (display != null) url.searchParams.set('display', display);
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { retry = 1; say('화면 기다리는 중'); };
    ws.onmessage = e => typeof e.data === 'string' ? control(JSON.parse(e.data)) : draw(e.data);
    ws.onclose = () => {
      ws = null;
      say('다시 연결 중');
      setTimeout(connect, retry * 1000);
      retry = Math.min(retry * 2, 10);
    };
  }

  function control(m) {
    if (m.t === 'hello') {
      display = m.display;
      const list = m.displays || [];
      pickDisplay.hidden = list.length < 2;
      pickDisplay.replaceChildren(...list.map((d, i) => {
        const o = new Option(`${d.main ? '주 화면' : `화면 ${i + 1}`} · ${d.width}×${d.height}`, d.id);
        o.selected = d.id === m.display;
        return o;
      }));
    } else if (m.t === 'input') {
      const text = m.ok ? null : INPUT_NOTES[m.reason] || INPUT_NOTES.unavailable;
      inputNote.textContent = text || '';
      inputNote.classList.toggle('on', !!text);
    } else if (m.t === 'denied') {
      showNote(m.reason);
      say(m.reason === 'permission' ? '권한 없음' : '보낼 수 없음');
    }
  }

  async function draw(buf) {
    const view = new DataView(buf);
    const seq = view.getUint32(0);
    const metaLen = view.getUint16(4);
    const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 6, metaLen)));
    const socket = ws;
    try {
      const bitmap = await createImageBitmap(new Blob([new Uint8Array(buf, 6 + metaLen)], { type: 'image/jpeg' }));
      if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
      }
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();
    } catch (_) {}
    // 다 그린 뒤에 ack — 그래야 서버가 이 화면이 그릴 수 있는 만큼만 보낸다.
    if (socket && socket === ws && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ t: 'ack', seq }));
    }
    showNote(null);
    const now = performance.now();
    frames.push(now);
    while (frames.length && now - frames[0] > 2000) frames.shift();
    shown = meta;
    status();
  }

  function status() {
    if (!shown || !ws) return;
    const fps = frames.length > 1 ? Math.round((frames.length - 1) / ((frames[frames.length - 1] - frames[0]) / 1000)) : 0;
    const quiet = !frames.length || performance.now() - frames[frames.length - 1] > 1500;
    say(`${shown.w}×${shown.h} · ${quiet ? '변화 없음' : `${fps}fps`}`, true);
  }
  setInterval(() => {
    const now = performance.now();
    while (frames.length && now - frames[0] > 2000) frames.shift();
    status();
  }, 1000);

  pickDisplay.onchange = () => {
    display = Number(pickDisplay.value);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ t: 'tune', display }));
  };
  // 조작 — 좌표는 그림 안 비율, 단추는 e.buttons(1 왼쪽·2 오른쪽·4 가운데) 그대로, 휠은 아래가 양수인 브라우저와 반대.
  const at = e => {
    const r = canvas.getBoundingClientRect();
    const clamp = v => Math.min(1, Math.max(0, v));
    return { x: clamp((e.clientX - r.left) / Math.max(1, r.width)), y: clamp((e.clientY - r.top) / Math.max(1, r.height)) };
  };
  const mods = e => (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
  let pendingMove = null;
  const pointer = e => {
    if (!controlling) return;
    e.preventDefault();
    const p = at(e);
    const m = { t: 'pointer', x: p.x, y: p.y, b: e.buttons & 7, m: mods(e) };
    // 움직임은 한 화면 틀에 하나 — 누름·뗌은 바로.
    if (e.type !== 'pointermove') { pendingMove = null; send(m); return; }
    if (!pendingMove) requestAnimationFrame(() => { if (pendingMove) send(pendingMove); pendingMove = null; });
    pendingMove = m;
  };
  canvas.addEventListener('pointerdown', e => {
    pointer(e);
    if (!controlling) return;
    keys.focus();
    // 그림 밖에서 놓아도 뗌이 오게 — 잡지 못해도 누름은 이미 갔다.
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', pointer);
  canvas.addEventListener('pointerup', pointer);
  canvas.addEventListener('contextmenu', e => { if (controlling) e.preventDefault(); });
  canvas.addEventListener('wheel', e => {
    if (!controlling) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    const p = at(e);
    send({ t: 'scroll', x: p.x, y: p.y, dx: Math.round(-e.deltaX * unit), dy: Math.round(-e.deltaY * unit) });
  }, { passive: false });
  // 글자는 이 기기 입력기가 조합을 끝낸 글째 보낸다. 조합 밖의 이름 붙은 키와 단축키만 키로.
  const NAMED = new Set(['Enter', 'NumpadEnter', 'Tab', 'Backspace', 'Escape', 'Delete', 'Home', 'End', 'PageUp', 'PageDown',
    'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12']);
  keys.addEventListener('keydown', e => {
    if (!controlling || e.isComposing || e.keyCode === 229) return;
    const shortcut = e.ctrlKey || e.metaKey || e.altKey;
    if (!NAMED.has(e.code) && !(shortcut && e.code)) return;
    e.preventDefault();
    send({ t: 'key', k: e.code, m: mods(e) });
  });
  keys.addEventListener('input', e => {
    if (!controlling || e.isComposing) return;
    if (keys.value) send({ t: 'text', s: keys.value });
    keys.value = '';
  });
  // 칸에 남은 글을 보낸다 — 조합 끝과 input 의 차례가 엔진마다 달라(웹킷은 끝 뒤에 input 이 한 번 더 온다) 두 번 가지 않게.
  keys.addEventListener('compositionend', () => {
    if (controlling && keys.value) send({ t: 'text', s: keys.value });
    keys.value = '';
  });
  controlButton.onclick = () => {
    controlling = !controlling;
    controlButton.setAttribute('aria-pressed', String(controlling));
    stage.classList.toggle('control', controlling);
    if (controlling) keys.focus(); else { keys.blur(); inputNote.classList.remove('on'); }
  };
  fitButton.onclick = () => {
    const actual = stage.classList.toggle('actual');
    fitButton.textContent = actual ? '창에 맞추기' : '실제 크기';
  };
  let resizing = null;
  addEventListener('resize', () => {
    clearTimeout(resizing);
    resizing = setTimeout(() => {
      const next = want();
      if (next.w === asked.w && next.h === asked.h) return;
      asked = next;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ t: 'tune', w: asked.w, h: asked.h }));
    }, 300);
  });
  connect();
})();
</script>
</body>
</html>
