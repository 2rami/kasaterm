[package]
name = "kasa-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

# Streamable-HTTP MCP server that exposes kasaterm pane control as
# model-invoked tools, driven directly by the host's agent_socket::Backend.
# Replaces the external python bridge (mcp/kasaspace_mcp.py).

[dependencies]
kasa-socket = { path = "../kasa-socket" }
anyhow.workspace = true
axum = "0.8.9"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
# ccglass-style capture proxy: forward claude의 Anthropic API 호출을 가로채 messages[]
# 를 깨끗하게 캡처(peek/jsonl 없이 라이브 대화). rustls 로 시스템 openssl 의존 회피.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
bytes = "1"
# tell(standalone): forkpty 로 `claude attach` 를 띄워 background 세션 stdin 에 주입.
libc = "0.2"
# pane session id: claude --session-id 가 엄격 UUID 요구(Windows 엔 uuidgen 없음).
uuid = { version = "1", features = ["v4"] }
# 계정별 Keychain 항목 찾기: claude 가 서비스명에 sha256(저장소 경로) 앞 8자를 붙인다.
# 이미 잠금 파일에 있던 버전이라 새로 받는 게 없다.
sha2 = "0.10"

# Standalone webview backend: serves the arona-ui daemon view off a second
# port so the webview survives kasaterm exiting.
[[bin]]
name = "kasa-serve-web"
path = "src/bin/serve_web.rs"
