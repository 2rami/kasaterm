[package]
name = "kasa-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

# Streamable-HTTP MCP server that exposes kasaterm pane control as
# model-invoked tools, driven directly by the host's agent_socket::Backend.
# Replaces the external python bridge (mcp/kasaspace_mcp.py).

[dependencies]
kasa-socket = { path = "../kasa-socket" }
# 웹 터미널: PTY 세션 레지스트리에 붙어 raw 바이트를 웹소켓으로 중계한다.
# kasa-pty 는 kasa-mcp 를 모르므로 순환이 아니다.
kasa-pty = { path = "../kasa-pty" }
# 셀 그리드 타입(ScreenUpdate·Cell) — gridwire 인코더가 쓴다.
kasa-bridge = { path = "../kasa-bridge" }
# wide 글자(한글) 폭 판정 — 스페이서를 걸러내는 데 쓴다.
unicode-width = "0.2"
anyhow.workspace = true
# remote 모듈의 ExtEvent 채널 — kasa-pty 의 start_external 과 같은 채널 타입.
crossbeam-channel.workspace = true
# "ws" — 웹 터미널의 양방향 채널. 기본 feature 에는 안 들어 있다.
axum = { version = "0.8.9", features = ["ws"] }
# 라우팅 **전에** 도는 레이어(`/u/<slug>/` 접두 벗기기)는 Router::layer 로는 못 건다 —
# 그건 라우팅 뒤다. ServiceBuilder 로 라우터 바깥에 두른다.
tower = "0.5"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
# 원격 PTY 호스트에 붙는 WS 클라이언트(remote 모듈). 서버(axum ws)와 같은 crate 에
# 두어 term-ws 프로토콜 지식이 한 곳에 모인다. lock 에 이미 있는 버전 — 전이 의존 0.
tokio-tungstenite = "0.29"
# ccglass-style capture proxy: forward claude의 Anthropic API 호출을 가로채 messages[]
# 를 깨끗하게 캡처(peek/jsonl 없이 라이브 대화). rustls 로 시스템 openssl 의존 회피.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
bytes = "1"
# tell(standalone): forkpty 로 `claude attach` 를 띄워 background 세션 stdin 에 주입.
libc = "0.2"
# pane session id: claude --session-id 가 엄격 UUID 요구(Windows 엔 uuidgen 없음).
uuid = { version = "1", features = ["v4"] }
# 계정별 Keychain 항목 찾기: claude 가 서비스명에 sha256(저장소 경로) 앞 8자를 붙인다.
# 이미 잠금 파일에 있던 버전이라 새로 받는 게 없다.
sha2 = "0.10"

# Standalone webview backend: serves the arona-ui daemon view off a second
# port so the webview survives kasaterm exiting.
[[bin]]
name = "kasa-serve-web"
path = "src/bin/serve_web.rs"

# 사내 세션 소통 중계 서버(2단계): 기계들이 등록해 세션 목록을 모으고 메시지를
# 대상 기계로 라우팅한다. 배포 위치(넷버드·클러스터)와 무관.
[[bin]]
name = "kasa-relay"
path = "src/bin/relay.rs"
