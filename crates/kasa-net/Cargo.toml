[package]
name = "kasa-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "카사넷 — 기기끼리 iroh P2P QUIC 직통 길(신원·허용 목록·TCP 포워드)"

[dependencies]
anyhow.workspace = true
iroh = "1.3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kasa-net-probe"
path = "src/bin/kasa-net-probe.rs"
