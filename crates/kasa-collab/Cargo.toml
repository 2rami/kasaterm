[package]
name = "kasa-collab"
description = "kasaterm collaboration host: board collector, tell ledger, surface keys and machine identity — shared by the kasaterm app and kasa tui."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# 다른 기계 판 당겨 오기·다른 기계로 tell 보내기(HTTP). 가장 무거운 의존(tokio·reqwest)이 여기서 들어온다.
net = ["dep:tokio", "dep:reqwest", "dep:futures-util"]
# 다른 크레이트 시험이 쓰는 가짜 백엔드(`board_service::synthetic`).
test-support = ["net", "dep:axum", "dep:bytes", "tokio/net", "tokio/rt-multi-thread"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
# 다른 기기로 실어 보내는 칸 캡처(`board_service::view`). kasa-socket 이 이미 쓰는 판이다.
base64.workspace = true
kasa-socket.workspace = true
# 칸 등록부(`lookup_session`)와 칸의 하네스 판정(`active_agent`).
kasa-pty.workspace = true
tokio = { workspace = true, features = ["rt", "time"], optional = true }
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
axum.workspace = true
futures-util.workspace = true
bytes.workspace = true
