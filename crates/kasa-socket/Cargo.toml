[package]
name = "kasa-socket"
description = "cmux-compatible Unix-socket JSON-RPC server. Speaks the same wire format as cmux's CLI so Claude Code's teammateMode (when it lands) drives kasaterm with no protocol shim."
edition.workspace = true
version.workspace = true
license.workspace = true

# 본체는 `src/cli.rs`(라이브러리) — 진입 파일 이름을 바꿔 두어 git 이 옛 `src/bin/kasaterm-cli.rs` 의
# 이동을 알아본다(다른 가지의 수정이 새 자리로 따라간다).
[[bin]]
name = "kasaterm-cli"
path = "src/bin/kasaterm_cli_main.rs"

[features]
default = ["app-update"]
# 카사텀 앱 재시작·업데이트 작업(`app_restart`·`app_update`, `app.*` 메서드, CLI
# `app-restart`·`app-update`). 앱을 스스로 갈아 끼우지 않는 호스트(`kasa tui` 는
# brew·npm·winget 이 올린다)는 끈다.
app-update = ["dep:ring"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# 앱 업데이트 창구가 받은 파일을 직접 잰다(sha256·Sparkle EdDSA·서명 base64). 셋 다 이미 워크스페이스에 있는 판이다.
base64.workspace = true
# 앱 업데이트 피드 서명 확인에만 쓴다 — 업데이트를 안 하는 호스트(카사라이트·kasa tui)는 안 싣는다.
ring = { workspace = true, optional = true }
sha2.workspace = true
# claude 신뢰 키(`claude_trust`)를 claude 와 같이 NFC 로 맞춘다. 이미 워크스페이스에 있는 판이다.
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    # 소유자 전용 저장소(private_store.rs): 열린 핸들의 소유자·DACL 읽기/쓰기와 ACE 종류·설명자 판 상수.
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    # kasaterm-cli share new 가 폴더 이름에 이 기기 날짜를 붙인다.
    "Win32_System_SystemInformation",
] }

# 터미널 가로 칸 수(TIOCGWINSZ)를 읽으려고. 상수도 구조체도 OS 마다 달라 손으로
# 적으면 한 쪽에서만 맞는 값이 박힌다 — 이미 의존성 트리에 있던 것이라 무거워지지 않는다.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
