[package]
name = "kasa-cells"
description = "Framework-neutral GPU cell renderer for terminal-style grids (wgpu). Bake glyphs into a swash atlas once, draw one instance per cell. sRGB→DisplayP3, box-drawing quads, CJK/emoji fallback. Pairs with alacritty_terminal / wezterm-term."
edition.workspace = true
version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/2rami/kasaterm"
homepage = "https://github.com/2rami/kasaterm"
documentation = "https://docs.rs/kasa-cells"
readme = "README.md"
keywords = ["terminal", "wgpu", "renderer", "glyph", "gpu"]
categories = ["rendering", "graphics", "gui"]
authors = ["2rami <goenho0613@gmail.com>"]
# Keep target/ and stray files out of the package.
include = [
    "src/**/*.rs",
    "src/**/*.wgsl",
    "examples/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "kasa_cells"

[dependencies]
wgpu.workspace = true
swash.workspace = true
bytemuck.workspace = true
anyhow = { workspace = true }
memmap2 = "0.9"

[dev-dependencies]
winit.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
