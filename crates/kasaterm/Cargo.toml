[package]
name = "kasaterm"
description = "Embeddable terminal cell renderer. wgpu + cosmic-text. Caller supplies Device/Queue/RenderPass — kasaterm renders cells into them."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Optional iced 0.14 glue — implements `iced::widget::shader::{Pipeline, Primitive}`
# on kasaterm's types so an iced app can drop a `Shader::new(primitive)` widget
# in and have kasaterm render the terminal body. Hosts that pick a different UI
# framework (egui, gpui, raw winit) don't pay for iced.
iced = ["dep:iced"]

[dependencies]
# Caller pins the wgpu major version; we follow whatever the host workspace
# wants so it never duplicates wgpu in the dep tree.
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.18"
unicode-width = "0.1"
# Cell data shape comes from tmux-bridge so callers can hand vt100 output
# straight through. If a future host wants a non-tmux input, add an adapter
# layer rather than coupling kasaterm to a specific protocol.
tmux-bridge.workspace = true
iced = { version = "0.14", features = ["advanced", "wgpu"], optional = true }
