name: kasaterm_mobile
description: "kasaterm 학생 원격 조종 앱 — 폰에서 학생 목록·화면·답장."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Native account sockets enforce redirect boundaries; web keeps the legacy path.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # 주소에 든 slug 가 곧 자격이라 평문 저장소가 아니라 Keychain 에 둔다.
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled portraits remain available while a remote custom image is loading.
  assets:
    - assets/students/gif/
    - assets/students/profile/
    # 데스크톱이 claude 화면에 세우는 도트 그대로 — 작업 중엔 스피너 자리에서 걷고(walk 6장),
    # 쉴 땐 입력상자 위에 선다(idle 4장). 파일명은 데스크톱과 같은 <slug>-N.png.
    - assets/students/walk/
    - assets/students/idle/
    # 상태줄 모델 표식(U+E0C0·E0C1) 자리에 데스크톱과 같은 로고 — 알파만 쓰고 색은 입힌다.
    - assets/icons/
  # 데스크톱 렌더러와 같은 짝: 라틴·아이콘은 JetBrains Mono Nerd, 한글은 D2Coding 으로
  # 떨어진다(한글이 정확히 두 칸). 터미널과 UI 글꼴을 분리해 셀 정렬을 보존한다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
    - family: TermMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
    - family: TermHangul
      fonts:
        - asset: assets/fonts/D2CodingLigatureNerdFontMono-Regular.ttf
        - asset: assets/fonts/D2CodingLigatureNerdFontMono-Bold.ttf
          weight: 700
    # ⏺(응답 마커)·⎿ 는 위 두 글꼴에 없다 — 데스크톱은 STIX Two Math(OFL) 에서 가져온다.
    # 없으면 iOS 가 이모지 글꼴로 떨어뜨려 동그라미가 이모지풍으로 커진다.
    - family: TermSymbol
      fonts:
        - asset: assets/fonts/STIXTwoMath.otf
