name: kasaterm_mobile
description: "kasaterm 학생 원격 조종 앱 — 폰에서 학생 목록·화면·답장."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 웹(크롬 개발 루프)과 iOS 를 한 코드로 — lib/ 에서 dart:io 를 쓰지 않는다.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # 주소에 든 slug 가 곧 자격이라 평문 저장소가 아니라 Keychain 에 둔다.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 데스크톱과 같은 학생 그림(idle 애니메이션·프로필)·SCHALE 로고·교실 배경. 서버 프사는
  # 터널 너머라 늦고 끊기면 없다 — 번들이 먼저 뜨고 서버 것이 오면 덮는다.
  assets:
    - assets/schale-classroom.png
    - assets/students/schale-logo.png
    - assets/students/gif/
    - assets/students/profile/
  # 데스크톱 렌더러와 같은 짝: 라틴·아이콘은 JetBrains Mono Nerd, 한글은 D2Coding 으로
  # 떨어진다(한글이 정확히 두 칸). 같은 글꼴이라야 같은 화면으로 보인다. UI 글은 시스템 글꼴.
  fonts:
    - family: TermMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
    - family: TermHangul
      fonts:
        - asset: assets/fonts/D2CodingLigatureNerdFontMono-Regular.ttf
        - asset: assets/fonts/D2CodingLigatureNerdFontMono-Bold.ttf
          weight: 700
