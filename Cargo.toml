[workspace]
resolver = "2"
members = [
    "app/kasaterm",
    "crates/agent-socket",
    "crates/kasaspace-mcp",
    "crates/cell-renderer",
    "crates/hangul-ime",
    "crates/pty-backend",
    "crates/tmux-bridge",
    "crates/kasa-shim",
    "spikes/iced-term",
    "spikes/egui-term",
    "spikes/gpui-term",
    "spikes/warpui-term",
    "spikes/winit-ime-test",
    "spikes/p3-poc",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
vt100 = "0.15"
crossbeam-channel = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
tmux-bridge = { path = "crates/tmux-bridge" }

# kasaspace-mcp leans on heavy proc-macro crates (rmcp / schemars). The
# Windows rustc/LLVM crashes (STATUS_ACCESS_VIOLATION / OOM) optimizing it at
# any opt-level >= 1; only the unoptimized path survives. It's an MCP server
# off the hot path, so pinning it to opt-level=0 in release dodges the crash
# with no perceptible runtime cost.
[profile.release.package.kasaspace-mcp]
opt-level = 0

