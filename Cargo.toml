[workspace]
resolver = "2"
members = [
    "app/kasaterm-cli",
    "app/kasaterm-sugarloaf-cli",
    "app/tmuxify",
    "crates/agent-socket",
    "crates/hangul-ime",
    "crates/kasaterm",
    "crates/tmux-bridge",
    "spikes/iced-term",
    "spikes/egui-term",
    "spikes/gpui-term",
    "spikes/warpui-term",
    "spikes/winit-ime-test",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
vt100 = "0.15"
crossbeam-channel = "0.5"
anyhow = "1"
tmux-bridge = { path = "crates/tmux-bridge" }
kasaterm = { path = "crates/kasaterm" }

