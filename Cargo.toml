[workspace]
resolver = "2"
members = [
    "app/kasaterm",
    "app/kasapet",
    "crates/kasa-pet-config",
    "crates/kasa-socket",
    "crates/kasa-mcp",
    "crates/kasa-cells",
    "crates/kasa-ime",
    "crates/kasa-pty",
    "crates/kasa-bridge",
    "crates/kasa-screen",
    "crates/kasa-gridview",
    "crates/kasa-collab",
    "crates/kasa-agents",
    "crates/kasa-net",
    "crates/kasa-net-ffi",
    "spikes/iced-term",
    "spikes/egui-term",
    "spikes/gpui-term",
    "spikes/warpui-term",
    "spikes/winit-ime-test",
    "spikes/p3-poc",
]

[workspace.package]
edition = "2021"
version = "0.2.62"
license = "MIT"

[workspace.dependencies]
vt100 = "0.15"
crossbeam-channel = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
kasa-bridge = { path = "crates/kasa-bridge" }
kasa-screen = { path = "crates/kasa-screen" }

# Windows rustc/LLVM crashed (STATUS_ACCESS_VIOLATION / OOM) optimizing
# kasa-mcp at any opt-level >= 1, blamed at the time on its heavy proc-macro
# crates (rmcp / schemars). Those were dropped with the MCP tools on 2026-09-26
# but the crash hasn't been re-tested on Windows, so the pin stays.
[profile.release.package.kasa-mcp]
opt-level = 0
