[package]
name = "kasadesk"
description = "KasaDesk: a standalone viewer for another machine's screen over kasanet. It keeps the picture while the kasaterm app restarts."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
kasa-cast = { workspace = true }
kasa-cells = { workspace = true }
kasa-castview = { workspace = true }
kasa-gridview = { workspace = true }
kasa-ime = { workspace = true }
kasa-net = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[lints]
workspace = true
