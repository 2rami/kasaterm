[package]
name = "tmuxify"
edition.workspace = true
version.workspace = true
license.workspace = true

# Round 2 (iced):
# - iced_term is GONE. The terminal body renders through iced's
#   `iced::widget::shader::Shader` widget, which exposes a `wgpu::Device`,
#   `wgpu::Queue`, and a scoped `RenderPass` via the `Primitive` trait.
# - tmux-bridge drives tmux-CC; the shader widget reads the vt100 grid and
#   builds instance buffers per cell.
# - cosmic-text 0.18 handles font shaping + SwashCache glyph rasterisation.
#   glyphon is unusable here: glyphon 0.11 = wgpu 29, but iced 0.14 = wgpu 27,
#   so the atlas/pipeline is rolled by hand in `cell_shader.rs`.
[dependencies]
tmux-bridge.workspace = true
# kasaterm — our own embeddable terminal cell renderer. Same architectural
# role as libghostty in cmux: caller gives it Device/Queue/RenderPass,
# kasaterm draws cells/box-rects/glyphs into them. The local
# `cell_shader.rs` is now a thin iced glue layer over kasaterm.
kasaterm = { workspace = true, features = ["iced"] }
anyhow.workspace = true
iced = { version = "0.14", features = ["tokio", "advanced", "image", "wgpu"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
rfd = "0.15"
# `wgpu` must resolve to the same crate iced_wgpu pins (27 today). If iced
# bumps the pin, move this in lockstep.
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.18"
unicode-width = "0.1"
# iced 0.14 re-exports streams from `iced_futures`, which uses the `futures`
# crate's mpsc. We only touch the Sender type to satisfy iced's
# `stream::channel` closure inference.
futures = "0.3"
