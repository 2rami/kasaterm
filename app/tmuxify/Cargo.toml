[package]
name = "tmuxify"
description = "Cross-platform cmux-style terminal. winit + sugarloaf renderer, tmux-bridge backend (Phase A/B), agent-socket JSON-RPC server (cmux-compatible). Phase C will swap tmux-bridge for portable-pty + alacritty_terminal so the binary runs natively on Windows."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tmux-bridge.workspace = true
pty-backend = { path = "../../crates/pty-backend" }
agent-socket = { path = "../../crates/agent-socket" }
sugarloaf = { version = "0.4", features = ["wgpu"] }
winit = "0.30"
raw-window-handle = "0.6"
anyhow.workspace = true
pollster = "0.4"
arboard = "3"
