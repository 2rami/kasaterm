[package]
name = "tmuxify"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# iced 0.14 + iced_term — the chrome stays iced; the terminal cell rendering
# moves to iced_term's proven alacritty-backed widget. Our own wgpu cell
# renderer (terminal_view.rs / Phase 2b) is now retired.
iced = { version = "0.14", features = ["tokio", "advanced", "image", "wgpu"] }
iced_term = "0.8"
tokio = { version = "1", features = ["time", "sync", "rt"] }
rfd = "0.15"
