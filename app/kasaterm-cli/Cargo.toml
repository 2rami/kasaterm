[package]
name = "kasaterm-cli"
description = "Minimal winit + wgpu host that drives kasaterm directly — no iced, no chrome. Proof that kasaterm is framework-agnostic."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# kasaterm without the `iced` feature so this binary genuinely has no
# iced anywhere in its dep tree.
kasaterm.workspace = true
tmux-bridge.workspace = true
wgpu = "27"
winit = "0.30"
pollster = "0.4"
anyhow.workspace = true
raw-window-handle = "0.6"
