[package]
name = "kasaterm"
description = "kasaterm — Cross-platform terminal multiplexer. winit + sugarloaf renderer with a direct portable-pty + alacritty_terminal backend (Phase C, default) and a legacy tmux-bridge backend behind KASATERM_BACKEND=tmux. Exposes a cmux-compatible JSON-RPC socket so external agents can drive it."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tmux-bridge.workspace = true
pty-backend = { path = "../../crates/pty-backend" }
agent-socket = { path = "../../crates/agent-socket" }
hangul-ime = { path = "../../crates/hangul-ime" }
cell-renderer = { path = "../../crates/cell-renderer" }
wgpu = "28"
sugarloaf = { version = "0.4", features = ["wgpu"] }
winit = "0.30"
raw-window-handle = "0.6"
anyhow.workspace = true
serde_json = "1"
pollster = "0.4"
arboard = "3"
kasaspace-mcp = { version = "0.1.0", path = "../../crates/kasaspace-mcp" }
# Git-status panel webview. Separate OS window so it can't touch the wgpu
# surface the terminal renders into — wry runs WKWebView/WebView2/WebKitGTK
# in its own layer. raw-window-handle 0.6 matches the workspace's winit 0.30.
wry = "0.55"
muda = "0.19.2"
# Encode image bytes into a self-contained data: URI for the preview
# window's <img> (the webview loads via with_html / null origin, so a
# file:// src is unreliable across the origin boundary).
base64 = "0.22"
# Decode image files to raw RGBA8 for the in-pane GPU image viewer
# (uploaded straight into a wgpu texture). default-features off so we
# only pull the codecs we actually open from a shell.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Parse markdown into an event stream for the in-pane document renderer
# (headings/paragraphs/code/lists laid out directly with the cell renderer).
pulldown-cmark = { version = "0.13", default-features = false }

# macOS-only: patch the wgpu CAMetalLayer's contentsGravity to topLeft so
# AppKit doesn't stretch stale layer contents during live window resize.
# ghostty's trick — same gravity, no presentsWithTransaction needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.17"
