[package]
name = "kasaterm"
authors = ["모묘모"]
description = "kasaterm — Cross-platform terminal multiplexer. winit + cell-renderer (wgpu, sRGB→DisplayP3 shader matrix) with a direct portable-pty + alacritty_terminal backend (Phase C, default) and a legacy kasa-bridge backend behind KASATERM_BACKEND=tmux. Exposes a cmux-compatible JSON-RPC socket so external agents can drive it."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
kasa-bridge.workspace = true
kasa-pty = { path = "../../crates/kasa-pty" }
kasa-socket = { path = "../../crates/kasa-socket" }
kasa-ime = { path = "../../crates/kasa-ime" }
kasa-cells = { path = "../../crates/kasa-cells" }
wgpu = "28"
# Direct HAL access — needed to reach wgpu's actual CAMetalLayer for
# Display P3 colorspace tagging. The high-level wgpu Surface API
# doesn't expose this knob and macOS layer-walk from the NSView root
# misses the real render layer (verified: Color Meter still showed
# pure sRGB 255,0,0 after walk-based tagging).
wgpu-hal = { version = "28", features = ["metal"] }
winit = "0.30"
raw-window-handle = "0.6"
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
# bincode-framed ScreenUpdate stream between daemon and GUI (src/stream.rs).
# Far more compact than JSON for the high-frequency per-frame cell payload.
bincode.workspace = true
pollster = "0.4"
arboard = "3"
kasa-mcp = { version = "0.1.0", path = "../../crates/kasa-mcp" }
# Git-status panel webview. Separate OS window so it can't touch the wgpu
# surface the terminal renders into — wry runs WKWebView/WebView2/WebKitGTK
# in its own layer. raw-window-handle 0.6 matches the workspace's winit 0.30.
wry = "0.55"
muda = "0.19.2"
# Encode image bytes into a self-contained data: URI for the preview
# window's <img> (the webview loads via with_html / null origin, so a
# file:// src is unreliable across the origin boundary).
base64 = "0.22"
# Decode image files to raw RGBA8 for the in-pane GPU image viewer
# (uploaded straight into a wgpu texture). default-features off so we
# only pull the codecs we actually open from a shell.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Parse markdown into an event stream for the in-pane document renderer
# (headings/paragraphs/code/lists laid out directly with the cell renderer).
pulldown-cmark = { version = "0.13", default-features = false }
# Rasterize Lucide SVG chrome icons into alpha-mask textures. Drawn through
# the glyph tint path (FLAG_COLOR off → texel.a × fg.rgb) so a single white
# raster picks up any theme color / hover state. Bundles usvg + tiny-skia.
resvg = "0.45"
# Move deleted file-tree entries to the OS trash (recoverable) instead of a
# hard unlink, cross-platform.
trash = "5"

# macOS-only: patch the wgpu CAMetalLayer's contentsGravity to topLeft so
# AppKit doesn't stretch stale layer contents during live window resize.
# ghostty's trick — same gravity, no presentsWithTransaction needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError", "NSDictionary"] }
# Native desktop notifications (UNUserNotificationCenter) so the alert carries
# kasaterm's own .app icon; block2 builds the authorization completion handler.
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationResponse"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    # Read a shell process's live cwd (status-bar path picker / breadcrumb):
    # no lsof on Windows, so walk the target's PEB → ProcessParameters →
    # CurrentDirectory via NtQueryInformationProcess + ReadProcessMemory.
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
png = "0.17"

# Embed the app icon (assets/app.ico) + version info into kasaterm.exe so the
# taskbar / Start menu / .msi installer show the real icon, not the default.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
