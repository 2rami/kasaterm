<!-- Google Antigravity 심볼 — 공식 사이트(antigravity.google) 헤더 로고의 벡터
     원본에서 심볼만 떼어냈다(2026-08-11). 그 워드마크는 viewBox 0 0 869 113 에
     심볼과 글자(x 132~868)가 한 SVG 로 들어 있어, 심볼 path 만 남기고 그 bbox
     (x 14~98, y 18~95)를 정사각으로 다시 감쌌다 — 16px 자리엔 글자가 못 들어간다.
     path 는 한 좌표도 고치지 않았다.

     ⚠️같은 SVG 에 y 38~151 짜리 덩어리 path 가 둘 더 있는데 **로고가 아니다** —
     viewBox 아래로 삐져나가 화면에 안 보이는 것이고, 넣으면 마크가 뭉개진 물방울이
     된다(직접 그려 보고 걸렀다). 아치 하나가 마크의 전부이고, 그건 앱 아이콘
     (/Applications/Antigravity.app icon.icns)과 같은 모양이다.

     원본은 같은 아치를 #3186FF 와 black 으로 두 번 겹쳐 그리고 앱 아이콘은 구글
     4색 그라디언트인데, 여기선 currentColor 단색이다 — queue_icon 이 알파만 쓰고
     색은 테마에서 입힌다(claude.svg 와 같은 규약). -->
