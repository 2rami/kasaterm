# 서울 서버 443 을 둘이 나눠 쓴다 — SNI 로 갈라 TLS 를 풀지 않고 넘긴다. /etc/nginx/stream.d/ 에 둔다.
# 관문(Caddy)에는 PROXY 프로토콜로 실제 접속자 주소를 싣는다 — 관문 로그인·OAuth 횟수 제한이 접속자마다 걸리게.
stream {
    map $ssl_preread_server_name $kasa_edge {
        relay-kr.debimarlene.com 127.0.0.1:8442;
        default                  127.0.0.1:9443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $kasa_edge;
    }

    # iroh-relay 는 PROXY 프로토콜을 모른다 — 여기서 벗겨 넘긴다. 중계 ACME(TLS-ALPN-01)도 이 길로 간다.
    server {
        listen 127.0.0.1:8442 proxy_protocol;
        proxy_pass 127.0.0.1:8443;
    }
}
