# 서울 서버 80 — /etc/nginx/conf.d/ 에 둔다. Cloudflare 가장자리가 하던 http → https 돌리기를 여기서 한다.
# 카사넷 중계(iroh-relay)는 80 에서 사로잡힌 포털 확인(/generate_204)을 받으므로 그 이름만 중계로 넘긴다.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name relay-kr.debimarlene.com;
    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_set_header Host $host;
    }
}
