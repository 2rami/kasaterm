<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>persona</title>
<style>
  :root {
    --bg-top: #10162a;
    --bg-bot: #1b2541;
    --ink: #eaf3fc;
    --ink-dim: #8aa6c8;
    --line: rgba(138,166,200,.22);
    --accent: #4a90e2;
    --bubble: rgba(255,255,255,.96);
    --bubble-ink: #15294a;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 패널 전체를 한 칸 세로 스택으로. 그림은 절대배치로 바닥에 붙고, 말풍선과
     입력창이 그 위에 뜬다 — 참조 배치(그림 위에 겹치는 말풍선)를 그대로. */
  #stage { position: relative; height: 100%; display: flex; flex-direction: column; }

  #top {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 0 12px;
  }
  #badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 8px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    font-size: 11px; letter-spacing: .02em; color: var(--ink-dim);
    backdrop-filter: blur(8px);
  }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
  #dot.working { background: #ffc83d; animation: pulse 1.4s ease-in-out infinite; }
  #dot.waiting { background: #ff6b6b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  #name { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink); opacity: .9; }

  /* 원화는 바닥에 발을 붙이고 폭을 채운다. 아래쪽을 살짝 페이드해 입력창과
     맞닿는 선을 지운다 — 잘린 그림처럼 보이지 않게. */
  #art {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 124%; max-width: none;
    display: block; object-fit: contain; object-position: bottom center;
    height: 74%;
    -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
    pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
  }
  #art.on { opacity: 1; }
  #art.pixel { image-rendering: pixelated; height: 42%; }

  #bubbleWrap {
    position: relative; z-index: 3;
    padding: 12px 12px 0 12px;
    display: flex; flex-direction: column; align-items: stretch;
  }
  #bubble {
    position: relative;
    background: var(--bubble); color: var(--bubble-ink);
    border-radius: 14px; padding: 11px 13px;
    font-size: 13px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    white-space: pre-wrap; word-break: break-word;
    opacity: 0; transform: translateY(-6px);
    transition: opacity .28s ease, transform .28s ease;
    max-height: 44vh; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  #bubble.on { opacity: 1; transform: none; }
  /* 꼬리는 말풍선 왼쪽 아래 — 그림 머리 쪽을 가리킨다. */
  #bubble::after {
    content: ""; position: absolute; left: 22px; bottom: -7px;
    width: 14px; height: 14px; background: var(--bubble);
    transform: rotate(45deg); border-radius: 2px;
  }
  #bubble.err { background: #ffe8e8; color: #7a2020; }
  #typing { display: inline-flex; gap: 3px; vertical-align: middle; }
  #typing i { width: 5px; height: 5px; border-radius: 50%; background: #8aa6c8; animation: blink 1.1s infinite; }
  #typing i:nth-child(2) { animation-delay: .18s }
  #typing i:nth-child(3) { animation-delay: .36s }
  @keyframes blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

  #spacer { flex: 1 1 auto; }

  #bar {
    position: relative; z-index: 3;
    padding: 10px; display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none; min-height: 36px; max-height: 96px;
    padding: 9px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(10,14,26,.72);
    color: var(--ink); font: inherit; font-size: 13px; line-height: 1.4;
    outline: none; backdrop-filter: blur(10px);
    -webkit-user-select: text; user-select: text;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: rgba(138,166,200,.65); }
  #send {
    width: 36px; height: 36px; flex: 0 0 36px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--accent); color: #fff;
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  #send:disabled { opacity: .4; cursor: default; }
  #send svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="stage">
  <img id="art" alt="" />
  <div id="top">
    <span id="badge"><span id="dot"></span><span id="state">…</span></span>
    <span id="name"></span>
  </div>
  <div id="bubbleWrap"><div id="bubble"></div></div>
  <div id="spacer"></div>
  <div id="bar">
    <textarea id="input" rows="1" placeholder="말 걸어보세요..."></textarea>
    <button id="send" title="보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const state = {
  name: '', slug: '', busy: false,
  history: [],            // 모델에 다시 실을 최근 왕복
  lastSpokeAt: 0,
  boardSig: null,         // 직전 board 지문 — 바뀐 순간에만 스스로 말을 건다
};

function setBubble(text, opts) {
  const b = $('bubble');
  b.classList.toggle('err', !!(opts && opts.err));
  b.innerHTML = '';
  b.textContent = text;
  b.classList.add('on');
}
function setThinking() {
  const b = $('bubble');
  b.classList.remove('err');
  b.innerHTML = '<span id="typing"><i></i><i></i><i></i></span>';
  b.classList.add('on');
}

async function loadWho() {
  try {
    const r = await fetch('/persona-who');
    const j = await r.json();
    state.name = j.name || '아로나';
    state.slug = j.slug || '';
    $('name').textContent = state.name;
    loadArt(j.has_portrait);
    loadAccent();
  } catch (e) { /* 서버가 아직 안 떴을 뿐 — 다음 폴링에서 다시 잡는다 */ }
}

// 원화가 없으면(배포본·새 캐릭터) 도트 스프라이트로 떨어진다. 자리를 비우지 않는 게
// 우선이라 화질은 양보한다.
function loadArt(hasPortrait) {
  const art = $('art');
  const url = hasPortrait
    ? `/persona-portrait?name=${encodeURIComponent(state.name)}`
    : `/character-sprite?slug=${encodeURIComponent(state.slug)}&motion=idle&frame=0`;
  art.classList.toggle('pixel', !hasPortrait);
  art.onload = () => art.classList.add('on');
  art.onerror = () => {
    if (!hasPortrait) return;
    loadArt(false);
  };
  art.src = url;
}

async function loadAccent() {
  try {
    const r = await fetch('/characters');
    const j = await r.json();
    const all = [].concat(j.leaders || [], j.members || []);
    const me = all.find((m) => m.name === state.name);
    if (me && me.header_color) {
      document.documentElement.style.setProperty('--accent', me.header_color);
    }
  } catch (e) { /* 색은 없어도 화면이 성립한다 */ }
}

// board 를 「말할 거리가 있나」의 관점으로만 압축한다. 토큰 수·도구 이름처럼 늘
// 흔들리는 값을 넣으면 매 폴링이 변화로 잡혀 계속 떠든다.
function signature(board) {
  return board.map((r) => `${r.surface_id}:${r.status}:${(r.title||'').slice(0,20)}`).join('|');
}
function worstStatus(board) {
  if (board.some((r) => r.status === 'waiting')) return 'waiting';
  if (board.some((r) => r.status === 'working' || r.status === 'building')) return 'working';
  return 'idle';
}

async function pollBoard() {
  try {
    const r = await fetch('/board');
    const j = await r.json();
    const board = j.board || [];
    const st = worstStatus(board);
    $('dot').className = st;
    $('state').textContent =
      st === 'waiting' ? '확인 필요' : st === 'working' ? `작업 중 ${board.filter((x)=>x.status!=='idle').length}` : 'idle';

    const sig = signature(board);
    if (state.boardSig === null) { state.boardSig = sig; return; }
    if (sig !== state.boardSig) {
      state.boardSig = sig;
      // 상황이 바뀌었을 때만, 그리고 너무 잦지 않게 스스로 말을 건다.
      if (!state.busy && Date.now() - state.lastSpokeAt > 45_000) speak('', true);
    }
  } catch (e) { /* 앱이 잠깐 바쁜 것뿐 */ }
}

// 아무 일도 없을 때의 잡담. 있으면 살아 있고 없으면 그냥 그림이라 거리를 둔다 —
// 8분에 한 번, 그것도 사용자가 창을 보고 있을 때만.
async function idleChat() {
  if (state.busy) return;
  if (document.hidden) return;
  if (Date.now() - state.lastSpokeAt < 8 * 60_000) return;
  speak('', true);
}

async function speak(message, unprompted) {
  if (state.busy) return;
  state.busy = true;
  $('send').disabled = true;
  setThinking();
  try {
    const r = await fetch('/persona-chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        message, unprompted: !!unprompted,
        character: state.name,
        history: state.history.slice(-12),
      }),
    });
    const j = await r.json();
    setBubble(j.text || '…', { err: !j.ok });
    if (j.ok) {
      if (message) state.history.push({ role: 'user', content: message });
      state.history.push({ role: 'assistant', content: j.text });
      if (state.history.length > 24) state.history = state.history.slice(-24);
    }
  } catch (e) {
    setBubble('말을 못 전했어요 — ' + e, { err: true });
  } finally {
    state.busy = false;
    state.lastSpokeAt = Date.now();
    $('send').disabled = false;
  }
}

function submit() {
  const t = $('input').value.trim();
  if (!t) return;
  $('input').value = '';
  $('input').style.height = 'auto';
  speak(t, false);
}
$('send').addEventListener('click', submit);
$('input').addEventListener('keydown', (e) => {
  // Shift+Enter 는 줄바꿈. 한글 조합 중(isComposing)에 Enter 를 삼키면 마지막 글자가
  // 확정되기 전에 전송돼 「안녕하세ㅇ」가 나간다.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 96) + 'px';
});

loadWho().then(() => speak('', true));
pollBoard();
setInterval(pollBoard, 5000);
setInterval(idleChat, 60_000);
</script>
</body>
</html>
