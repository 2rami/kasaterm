[package]
name = "screen-stream"
version = "0.1.0"
edition = "2021"
description = "Parsec-class screen streaming spike: ScreenCaptureKit + VideoToolbox over kasanet QUIC"

[dependencies]
anyhow = "1"
kasa-net = { workspace = true }
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
